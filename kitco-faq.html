["Scrap","Selling Scrap","2","How is my scrap tested, and what does it cost?","**Short answer:** Most scrap is checked with a free scratch test. If a melt or assay is needed, we'll ask you first, and fees apply.\n**How will Kitco test my scrap metal?**\n1. Scratch test: we test your metal on a touchstone with acid. This is free.\n2. Melt and/or assay: if the scratch test can't tell us the precious metal content, we can melt and/or assay it at your request.\n**Good to know**\n- Assaying is destructive, so items can't be returned in their original condition.\n- Our tests can accurately determine purity only up to 18 Karats. Items believed to be purer than 18K must meet the test criteria for 18K and have a recognized stamp. If an item scratch tests at 18K but has no stamp or an unclear stamp, we'll buy it at the 18K scrap price.\n**What will it cost to have my scrap metals tested by Kitco?**\nIf a scratch test does the job, there's no processing fee. If a melt and/or assay is needed, we'll contact you before going ahead. Once you approve, we melt and/or sample your material and send a sample to an independent lab.\n- Gold: $30 per melt, $30 per assay, 2 business days, 1 g minimum sample\n- Silver: $30 per assay, 2 business days, 1 g minimum sample\n- Platinum: $37 per assay, 5 business days, 1 g minimum sample\n- Palladium: $37 per assay, 5 business days, 1 g minimum sample\n- Rhodium: $250 per assay, 15 business days\n- Polishings: $50 minimum per assay, 10 business days, 20 g minimum sample\n- Dental gold: $50 minimum per assay, 2 business days, 1 g minimum sample\nLab times are minimums. Sample sizes may change depending on the amount and type of material to be tested.\n**How much melt loss should I expect if my material is melted?**\nMelting removes impurities (including alloying metals), so the weight goes down. Gemstones, enamel and other embedded metals are also separated out and kept in borax (a cleansing substance).\n- Pure metal items (no gemstones): up to about 1%\n- Items with gemstones: expect more than 1%\n- Gold filings: up to 30%, depending on how clean they are. The more contamination, the higher the loss.\n- Dental material: varies with extras like teeth and denture composites. Dental melts containing palladium or platinum may need copper added, so the loss is hard to estimate.\n**Can I send in material just to be tested?**\nYes, if you have an existing Kitco business refining account. Testing-only fees:\n- $70 handling fee\n- Return shipping (unless you collect it in person), based on the sample's weight and shipping method\n- Any processing fees, like melt and assay fees\nHeads-up: tested material will NOT come back in its original condition.","All","All","Can I send in material just to be tested?\nHow will Kitco test my scrap metal?\nHow much melt loss should I expect if my material is melted?\nWhat will it cost to have my scrap metals tested by Kitco?"],		
["Scrap","Selling Scrap","3","How can I check Kitco’s suppliers and bank references?","**Short answer:** Yes, you're welcome to check our references at any time.\nYou'll find a full list of our potential referees (suppliers and bank references) on our website.","All","All","How can I check Kitco’s suppliers and bank references?"],		
["Scrap","Selling Scrap","4","How do I confirm a price for my scrap?","**Short answer:** Confirming a price locks in what we'll pay for your scrap, so market swings can't affect your sale. Call us to confirm; a 20% deposit is required.\n**What is a price confirmation and how does it work?**\nIt's a binding agreement between you and Kitco Metals Inc.: we agree to buy your scrap at the price in effect when you confirm. It takes the market uncertainty out of your sale.\nAll price confirmations are binding and subject to our terms and conditions. Not meeting them can lead to extra charges.\n**What if the amount we receive is different?**\n- Less pure metal than you confirmed: you're responsible for charges from defaulting on the sale, and you'll be charged for the difference.\n- More pure metal than you confirmed: we buy the confirmed quantity at your confirmed price, and the surplus at the market price at the time of settlement.\n**How can I confirm a price for my sale?**\n- Call 1 877 775-4826 or 514 313-9999 (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET).\n- Or send your material first, and confirm a price any time up to when Kitco contacts you to settle it.\nDeposit: we require a 20% deposit on account as collateral for any scrap sale up to $100,000. To fund your account, see “How can I add funds to my account?”.\n**Can I confirm a price shown online?**\nYes. You can confirm current prices for a specific quantity of precious metal. For full details on our policies and procedures, see our Confirming a price FAQs.","All","All","What is a price confirmation and how does it work?\nHow can I confirm a price for my sale?\nCan I confirm a price shown online?"],		
["Scrap","Selling Scrap","5","Do I have to confirm a price, and what are the terms?","**Short answer:** No, confirming a price is optional. But if you do confirm one, you must ship within two business days, and we must receive your package within ten.\n**Does a price have to be confirmed for all sales?**\nNo. If you don't confirm a price in advance, we'll settle using the market price at the time of settlement. And if you haven't confirmed a price, there's no charge if you decide not to send the material after all.\n**Can I choose to settle my material at a later date once your representative calls me?**\nYes. Send your material without confirming a price. Once we finish processing your package, you can either:\n- Accept the market price when Kitco contacts you, and confirm by phone or email that you agree, or\n- Get a credit for the pure metal amount to your Kitco Pool account\nTip: keep your contact information with Kitco up to date to avoid delays in processing and payments.\n**What are the terms and conditions for confirming a price?**\nConfirming a price is a binding agreement for the specified quantity and purity of precious metal. Once you confirm, you must:\n1. Ship and postmark your material within two business days\n2. Make sure Kitco receives your package within ten business days\n3. Give us your tracking number within two business days: call 1 877 775-4826 or email info@kitco.com\n4. Send at least the amount of pure precious metal you confirmed a price for\nMiss any of these and your sale will be cancelled, with an administrative fee and market loss repayments. Kitco reserves the right to refuse a sale if the confirmed price is incorrect due to computer-related problems.","All","All","Does a price have to be confirmed for all sales?\nWhat are the terms and conditions for confirming a price?\nCan I choose to settle my material at a later date once your representative calls me?"],		
["Scrap","Shipping & Testing","1","Will you contact me when my scrap arrives and is tested?","**Short answer:** Yes, twice: once when your package arrives, and again after it's tested.\n**Will Kitco contact me once my package has been received?**\nYes. If you completed your online packing slip, we'll email you a confirmation when your package arrives.\n**Will Kitco contact me once my material has been tested?**\nYes. Once we've verified your material, we'll contact you to review what was in your package and make sure it's finalized with the payment option on your packing slip.\nNote: once a price has been confirmed, the agreed payment option can't be changed.","All","All","Will Kitco contact me once my package has been received?\nWill Kitco contact me once my material has been tested?"],		
["Scrap","Shipping & Testing","2","What if there's a problem with my scrap shipment?","**Short answer:** We can refuse a package that looks tampered with, is too contaminated, or comes from an individual. You can ask for your material back any time before we pay you, but fees may apply.\n**Can Kitco ever refuse my package?**\nYes, in three situations:\n1. Your package looks like it's been tampered with. Following our packing instructions (see “How do I prepare and package my materials for shipment?”) helps prevent this.\n2. Your items contain metal contaminants beyond acceptable limits, which can make them impossible to refine.\n3. You're an individual sending us precious metal scrap. See “Who can sell scrap metal?”.\nRefused packages are returned to you at your expense (including insurance, if you want it). We can also cancel your sale if your metals are found to be contaminated. If that happens, you may have to pay an administrative fee and reimburse Kitco for any market loss caused by the cancellation.\n**What will happen if Kitco rejects my package after I have confirmed a price?**\nWe'll contact you to let you know. Your confirmed price will still be honored as long as you:\n- Send us the new shipping tracking number, and\n- Make sure Kitco receives the package within 15 days of the initial rejection\nIf not, your sale may be cancelled, and you may have to pay administrative fees and market loss charges as described in our Confirming a price FAQs.\n**What happens if the weights that I have indicated do not match those determined by Kitco?**\nThe weights Kitco determines are the ones we use. If they're lower than the weights you gave when you confirmed your price, you may be charged for the difference (see “At what point will market loss repayment fees be applied?”).\nYou can trust our numbers: all our scales are legal for trade and calibrated in accordance with government regulations.\n**Can I have my material returned to me?**\nYes, any time up until we send your payment. Fees depend on whether it's been tested yet:\n**Returned before testing**\n- Return shipping fee (based on weight and shipping method)\n- $50 administrative fee, if you confirmed a price\n- Repayment of any market loss Kitco sustains, depending on how the market moves, if you confirmed a price\n**Returned after testing**\n- $70 handling fee\n- Any processing fees, like melt and assay fees\n- Return shipping fee (based on weight and shipping method)\n- $50 administrative fee, if you confirmed a price\n- Repayment of any market loss Kitco sustains, depending on how the market moves, if you confirmed a price\n**Please note**\n- Assaying is destructive, so assayed material can't be returned in its original condition.\n- Once you accept any form of settlement, the material becomes Kitco's property and is melted down.\n- Material can't be returned once you've been paid for it.","All","All","What happens if the weights that I have indicated do not match those determined by Kitco?\nWhat will happen if Kitco rejects my package after I have confirmed a price?\nCan Kitco ever refuse my package?\nCan I have my material returned to me?"],		
["Scrap","Shipping & Testing","3","How do I pack and ship my scrap?","**Short answer:** Sort your scrap by type and purity, label each bag with its weight, create a packing slip, double-box it, and ship it registered and insured to the address on your slip.\n**Is it necessary for me to separate my material?**\nYes. Sorting your material (as shown below) and clearly marking the weight on each bag gets your sale processed and paid faster.\n**How do I prepare and package my materials for shipment?**\nFind your material below and follow the steps for it.\n**Bullion and melted bars**\n- Gold bullion: separate by purity (14k, .900, 22k, 24k, etc.) and keep jewelry separate from coins.\n- Silver bullion: separate by purity (pure 999 or sterling 925). Remove bars and coins from plastic protectors, capsules, books, etc.\n- Melted bars (scrap melted down into a single bar): no special packing needed, but all melted bars must be assayed (see our assay charges).\n**Jewelry and watches**\n- Gold jewelry: sort into separate bags by purity (10k, 14k, 18k, etc.) and clearly mark the purity (karat) and weight on each bag.\n- Gold and silver jewelry: remove any stones and gems first. Kitco does not pay for stones or gems. Any left in are discarded, and a fair weight is deducted from the total jewelry weight (this doesn't apply to lots being melted).\n- Watches: remove mechanisms and face glasses, and any bands not made of precious metals. Bag watches separately from other scrap, and mark the purity and weight on each bag.\n**Workshop and dental material**\n- Filings: sift them clean and mark the weight on the bag. Dirty (un-sifted) material has to be assayed for a fee.\n- Polishings: call 1 877 775-4826 before shipping. Keep them separate from all other scrap, in garbage bags.\n- Dental gold: remove all teeth to avoid melt and assay charges. Bag white gold and yellow gold separately, keep it apart from other gold scrap, and mark the weights on the bags.\n- Unused dental material: bag separately. If it's in its original sealed packaging, include the manufacturer's certificate showing the metals present.\n- Please note: Kitco does not refine or purchase silver amalgam.\n**Silver coins and silverware**\n- Silver-containing U.S. and Canadian currency coins: separate by purity and don't roll them. Use sturdy bags or containers, and clearly mark the weight and purity (or year) on each bag.\n- Silver knives with stainless steel blades: remove the steel blades, or Kitco will deduct 90% of the weight before buying.\n- Silver candlesticks: bag separately and remove paste, filling and other non-metallic material from the base, or Kitco will deduct 90% of the weight before buying.\n- Silverware: sort into five groups: sterling knives; candlesticks; sterling silverware with no solder (plates, forks, spoons and butter knives with silver blades); silver that's 80% pure rather than 92.5% Sterling; and everything else. Remove all wax and steel rods from filled pieces. If it's not prepared this way, Kitco will determine the approximate weight to deduct.\n**Industrial and other items**\n- Electrical contacts: remove as much non-metallic material as possible and bag separately. We accept only gold fingers, in quantities sufficient to cover assay charges (generally around 5 kg).\n- Gold filled and gold plated: bag each separately from other scrap.\n- Placer gold and photo flakes: bought only after melt and assay results. Dry photo flakes before shipping.\n- Batteries: we buy only silver oxide batteries, not lithium or any other type.\n- Odd items (like carpets from work areas): carpets must contain enough metal to cover assay charges.\n**How should I ship my materials to Kitco?**\n1. Create a packing slip after separating, weighing and identifying your material. You'll need a Kitco account, and you'll enter your Kitco account number on the slip. Create it online, or call 1 877 775-4826 for help (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET).\n2. Print your packing slip and put it inside the package. Write your Packing Slip Reference Number on the outside of the box.\n3. Shipping more than one box? Put a copy of the slip in each one and label them \"Multiple Packages – 1 of 3\", \"Multiple Packages – 2 of 3\", and so on.\n4. Use heavy-duty boxes and strong packing tape, and double-box your materials. Pack so nothing moves around, but don't overstuff.\n5. Ship by registered and insured mail. That's what we recommend for all precious metals.\nHeads-up: packages that arrive damaged will be refused and returned to you for a content audit at your expense.\nTip: download our shipping instruction sheet for more detail. Packages prepared exactly as instructed, with all the requested information, are processed faster.\n**Where should I ship my material?**\n- From the USA: our Rouses Point facility\n- From Canada: our Montreal office\n- From outside North America: whichever office costs you less to ship to\nThe full address and instructions appear automatically on your Kitco packing slip. Please note that Kitco is not responsible for customs clearing, duties, or transportation on any package.","All","All","How do I prepare and package my materials for shipment?\nIs it necessary for me to separate my material?\nHow should I ship my materials to Kitco?\nWhere should I ship my material?"],		
["Scrap","Shipping & Testing","4","Do I need a packing slip, and does it confirm my price?","**Short answer:** Yes, every shipment needs a packing slip. But creating one doesn't lock in your price; only a phone call does that.\n**Do I have to complete a packing slip online before shipping my material to Kitco?**\nYes. Please complete a packing slip and include it with any material you send. Write the reference number it generates on the outside of your package, so we have everything we need to process your sale without delays.\nYou'll need a Kitco account to create a packing slip, and you'll enter your Kitco account number on it. Create your packing slip online.\n**Does completing a packing slip mean that my prices are confirmed?**\nNo. You can only confirm a price for a sale by calling 1 877 775-4826 (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET). For more information, see our Confirming a price FAQs.","All","All","Do I have to complete a packing slip online before shipping my material to Kitco?\nDoes completing a packing slip mean that my prices are confirmed?"],		
["Scrap","Selling Scrap","6","How much will Kitco pay me for my scrap metal?","**Short answer:** Our current scrap buying prices, which are constantly updated in line with market prices.\nYou'll find them on our refining and scrap page. If you haven't confirmed a price in advance, you'll be paid the price in effect at the time of settlement.","All","All","How much will Kitco pay me for my scrap metal?"],		
["Scrap","Getting Paid","1","What are my payment options for scrap?","**Short answer:** Choose a check, bank wire, bullion, or a credit to your Kitco account or Kitco Pool. Several options are free. Payment can only go to the account owner.\n**What are my settlement options? How will I be paid by Kitco?**\nYour options depend on your country of residence (or where your business has its principal place of business).\n**Free options**\n- Check by regular mail (US and Canadian customers only)*\n- Bullion products normally carried by Kitco\n- Credit to the funds on your account\n- Credit to your Kitco Pool account\n**Options with a fee**\n- Check by courier: $30 (US and Canadian customers only)*\n- USD or CAD bank wire to a bank in the USA or Canada: $40†\n- USD or CAD bank wire to a bank outside the USA and Canada: $60†‡\n- GBP or EUR bank wire: £50/€60‡§\n**Good to know**\n- *Checks can only be sent for USD or CAD payments to US/Canadian residents.\n- †Getting a bank wire from Kitco for the first time? Fill in and submit a Bank Wire Information form first.\n- ‡For USD or CAD wires to banks outside the USA and Canada, Kitco pays all intermediary bank fees.\n- §Payments in GBP or EUR can only be made by bank wire or credited to funds on account.\n**Can I exchange my scrap metal for precious metal bullion products?**\nYes! Bullion products are one of your settlement options. For details, call 1 877 775-4826 (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET).\n**Can I have the payment for my sale sent to a third party?**\nNo. Because of anti-money laundering legislation, Kitco can't send your payment to anyone who isn't a designated account owner.\n- Business Accounts: payment can be made in the business name only.\n- Sole Proprietorships: payment can be made in the business name or the sole proprietor’s name, once Kitco has received proper authorization documentation.\nWant to add someone else to your Kitco account? Call 1 877 775-4826 or 514 313-9999.","All","All","What are my settlement options? How will I be paid by Kitco?\nCan I have the payment for my sale sent to a third party?\nCan I exchange my scrap metal for precious metal bullion products?"],		
["Scrap","Getting Paid","2","How long will it take for me to receive my payment?","**Short answer:** Usually two to 12 business days from when we receive your scrap until we send payment, plus delivery time for your chosen payment method.\n**What happens after your scrap arrives**\n1. We test it. Assaying your products and verifying their purity usually takes two to 10 business days.\n2. We send your payment within two business days of verifying.\n3. The money reaches you. Depending on how you're paid, this can take up to 10 business days.\n**What can slow things down**\nU.S. or Canadian statutory holidays, extraordinarily high market activity, very high-value sales, or unforeseeable circumstances like transport strikes or natural disasters.\n**Tip:** A bank wire is usually the quickest way to receive your money. See your settlement options for fees.","All","All","How long will it take for me to receive my payment?"],		
["Scrap","Getting Paid","3","Will Kitco pay taxes associated with the scrap metal sale?","**Short answer:** Yes, on request, for Canadian-registered businesses selling through a refining business account.\n**How it works**\n- Who qualifies: businesses registered in Canada selling precious metal scrap through their refining business account.\n- How it's calculated: taxes are calculated and paid according to the province where the business is registered.\n- What we need: a company invoice listing the items sold, along with your tax registration number.","All","All","Will Kitco pay taxes associated with the scrap metal sale?"],		
["Scrap","Cancellations","1","Can I cancel a scrap sale, and what does it cost?","**Short answer:** Yes, you can cancel after confirming a price, but there's always a $50 administrative fee, plus a market loss charge if prices have moved against you. We'll contact you before charging anything.\n**Can a sale of scrap metal be cancelled once a price has been confirmed for it?**\nYes, but cancellation charges apply. See below for how they're calculated.\n**What is your cancellation policy with respect to the sale of scrap metal and how do you calculate market loss repayments for the sale of scrap metal?**\n- Every cancelled sale: a $50 administrative fee.\n- If market prices have gone up since you confirmed: we take the difference between your confirmed price and the current market price and multiply it by the number of pure ounces. That amount, in addition to the $50 administrative fee, is charged to your credit card or deducted from the funds held in your Kitco account.\n- If what you send is lower in weight, purity or value than what you confirmed: the deficit (the difference between the value you confirmed and the value we actually receive) is treated as a cancellation, under the usual policy, including the $50 administrative fee.\nBefore you're charged, Kitco will try to contact you three times by phone and at least once by email (if we have your email address on file) to tell you about the fees.\n**At what point will market loss repayment fees be applied?**\n**1. You confirm a sale but send no material**\nThe sale is automatically cancelled after 10 business days.\n**2. You send less pure metal than you reserved**\nYou'll be charged an administrative fee of $50. If the price of pure metal has moved against your sale, you'll also be charged the difference between your sale price and the current market price, multiplied by your deficit amount.\nExample:\n- You confirm a price for 100g of 18k (75 g of pure)\n- You send 100 g of 10k (41.6 g pure)\n- That's a deficit of 33.4 g of pure (75g - 41.6g = 33.4g)\n- You can pay the difference by credit card, or have it deducted from the balance Kitco owes you for the material.\n**3. You change your mind after your material has been tested**\nThe sale is cancelled immediately and all your material is returned to you. These fees apply:\n- A minimum $50 administrative and market loss repayment fee (based on how the price moves, as above)\n- A $70 handling fee\n- Return shipping fee, depending on weight and shipping method\n- Any processing fees, like melt and assay fees\nBefore you're charged, Kitco will try to contact you three times by phone and at least once by email (if we have your email address on file).\n**Tip:** Only confirm a price when you're sure about the quantity and purity you're sending.","All","All","Can a sale of scrap metal be cancelled once a price has been confirmed for it?\nWhat is your cancellation policy with respect to the sale of scrap metal and how do you calculate market loss repayments for the sale of scrap metal?\nAt what point will market loss repayment fees be applied?"],		
["Shipping & Returns","Costs & Duties","1","Shipping costs, insurance, duties and taxes","**Short answer:** Standard shipping in the U.S. and Canada is $15, or FREE on orders of $5,000 or more. Insurance is 0.65% of the metal value. Large orders are quoted separately, and international customers pay any local duties and taxes.\n\n**What are the shipping and insurance costs?**\n*U.S. & Canada: standard orders*\n- Standard shipping: $15 USD/CAD, or FREE with purchase of $5,000 USD or more (continental U.S. or within Canada)\n- Delivery time: 2-5 business days. In rare cases, USPS or Canada Post can take 10 - 15 business days.\n- Insurance: 0.65% of the total metal value ($6.50 per $1,000)\n- Washington State: 0.80% ($8 per $1,000)\n- Texas State: 0.99% ($9.90 per $1,000)\n\nGood to know:\n- P.O. Boxes and rural addresses ship by USPS or Canada Post.\n- We don't ship to Army Post Office (A.P.O.) addresses.\n\n*Large or non-standard orders*\nThese include, but aren't limited to:\n- Multiple 500-coin Monster Boxes\n- 100 or 400 oz gold bars\n- 700 oz or more of product\n- Purchases worth over $100,000\n- Purchases requiring armored shipment, or deemed non-standard by Kitco\n\nThey may ship in more than one package, sometimes by armored car, and cost more than the standard rates. Armored car deliveries can only go to businesses, banks or depository services, not to homes or post boxes. We quote these case-by-case. For a quote, call 1 877 775-4826 or 514 313-9999.\n\n**Will any duties and taxes be charged on the shipment that Kitco sends me?**\nThey might, if you ship outside the United States and Canada. Depending on the country, taxes and duties, including Value Added Taxes (VATs), may apply. Under our Terms and Conditions, you're solely responsible for paying them.","All","All","What are the shipping and insurance costs?\nWill any duties and taxes be charged on the shipment that Kitco sends me?"],		
["Shipping & Returns","Delivery & Pickup","1","How are purchases shipped, and is a signature required?","**Short answer:** We ship with trusted couriers, and every package needs a signature. Larger orders may arrive in more than one package.\n\n**How are purchases shipped?**\n*U.S. & Canada*\n- Shipped by Kitco's preferred mail delivery services. All packages require a signature.\n- High-value, large or non-standard orders may use other methods (see \"Shipping costs, insurance, duties and taxes\").\n- Your order may come in more than one package and arrive on different days.\n- Missed the delivery? The courier will leave a notice so you can reschedule or pick it up. Bring valid photo identification.\n\n*International (outside the U.S. and Canada)*\n- Shipped from Canada by Kitco's preferred courier services, and all packages require adult signature.\n- You're responsible for any customs fees, VATs, or duties.\n- Tip: check with your local customs agency before you buy, so you know the costs and any documents you'll need to import your metals.\n\nPackage not arrived within the expected time? Call 1 877 775-4826 or 514 313-9999.\n\n**Will items be left without a signature?**\nNo. Under normal circumstances, every package needs a signature upon delivery, with all of our partner couriers.\n- Keep an eye on your tracking details. SMS notifications may also be available through the courier's website (linked in your tracking email).\n- Think your package was left without your signature? Call 1 877 775-4826 or 514 313-9999 immediately.\n- If you have a signature waiver arrangement with UPS, FedEx, or other couriers, Kitco can't be held responsible for packages delivered to you.","All","All","How are purchases shipped?\nWill items be left without a signature?"],		
["Shipping & Returns","Delivery & Pickup","2","Can I ship to another address or change it after shipping?","**Short answer:** Usually yes. Just call us before or after you order. Changing the address after it ships costs $20, if we can do it.\n\n**Can I have my purchase shipped to a location other than the address on my account?**\nIn most cases, yes:\n1. Call 1 877 775-4826 or 514 313-9999 to place your order, or after you've ordered.\n2. Tell us the alternative address.\n3. Let us know if it's for this purchase only, or all future purchases.\n\nSometimes we'll ask for a Shipping Direction form, plus a clear copy of a valid, government-issued photo ID (passport, driver's license, national identity card, citizenship card or permanent resident card).\n\nGood to know:\n- PayPal or Credit Card orders can only go to a verified ship-to address or the credit card billing address.\n- We can't be responsible for a package delivered to a non-residential address and signed for by a third party.\n- Only U.S. Postal Service registered and insured mail or Canada Post can deliver to a post office box. All other methods need a street address and a signature.\n- Once a package is signed for, it is no longer covered by insurance.\n\n**Can I make changes to my shipping address once my order has shipped?**\nGive us a call at 1 877 775-4826 or 514 313-9999 and we'll see if we can help. A $20 administration fee applies to any address change after a package has shipped.","All","All","Can I have my purchase shipped to a location other than the address on my account?\nCan I make changes to my shipping address once my order has shipped?"],		
["Shipping & Returns","Tracking, Loss & Damage","1","What if my package is lost, stolen or damaged?","**Short answer:** Every shipment is fully insured while it's in transit. If something's damaged or missing, call us within 48 hours and keep the packaging.\n\n**Who is liable should my package be lost or stolen while in transit?**\nKitco fully insures all shipments, so our insurer covers anything that happens in transit. We can't accept responsibility if:\n- You have a signature waiver on file with the courier company\n- Your purchase is delivered to a non-residential (or alternative) address\n- Your package is signed for by a third party\n\n**What should I do if my shipment is damaged or missing items?**\n1. Refuse any package that is damaged or looks tampered with.\n2. If items are missing or damaged, call 1 877 775-4826 or 514 313-9999 within 48 hours of receiving your package.\n3. Don't throw away the packaging. If we open an investigation, we may need photos of it.\n4. We may also need a notarized letter describing what's missing or damaged. Our team will explain exactly what documents and photos we need.","All","All","Who is liable should my package be lost or stolen while in transit?\nWhat should I do if my shipment is damaged or missing items?"],		
["Shipping & Returns","Delivery & Pickup","3","What happens if a package shipped by Kitco is undeliverable?","**Short answer:** The courier sends it back to us, and we'll reach out. If we don't hear back within 10 business days, we buy the metal back and credit your account, minus a $20 fee.\n\n**What happens if a package shipped by Kitco is undeliverable?**\nA package is undeliverable if:\n- delivery is refused,\n- the address is incorrect, incomplete or illegible, or\n- 3 separate attempts were made and no one of legal age was home.\n\nWhat happens next:\n1. The courier returns it to us, and we'll promptly let you know.\n2. Send us reshipment instructions and we'll ship it again. Normal shipping and insurance charges apply.\n3. No instructions within 10 business days of our notice? We'll buy the goods back from you, with an administrative fee of $20.\n\nThe buyback uses the last London Bullion Market Association price fixing on the deadline date (or the Kitco live spot price for rhodium), plus applicable premiums. The proceeds, less fees and charges, are deposited as funds on your Kitco account.","All","All","What happens if a package shipped by Kitco is undeliverable?"],		
["Shipping & Returns","Delivery & Pickup","4","Is in-store pickup available at your Montreal counter or U.S. locations, and is there any fee for it?","**Short answer:** Yes. Pickup at our Montreal counter is free if the item is in stock. U.S. pickups may cost $70.\n\n**Is in-store pickup available at your Montreal counter or U.S. locations, and is there any fee for it?**\n- Montreal counter: free, as long as the item is in stock.\n- Our locations in the Eastern U.S.: available, but may include a $70 pickup fee.\n\nTo schedule a pickup or ask questions, call 1 877 775-4826 or 514 313-9999.","All","All","Is in-store pickup available at your Montreal counter or U.S. locations, and is there any fee for it?"],		
["Shipping & Returns","Tracking, Loss & Damage","2","How can I track my package?","**Short answer:** Your tracking number is posted in your online account and/or emailed to you.\n\n**How can I track my package?**\nDepending on what you bought, you'll find your tracking number in your account online, in your email, or both. It may take up to 24 hours for tracking to show any activity on the courier's website.","All","All","How can I track my package?"],		
["Shipping & Returns","Returns & Exchanges","1","Can I return or exchange my items?","**Short answer:** Contact us within three (3) business days of delivery. Damaged or not-as-described items are exchanged free. Bullion can't be refunded, but we can buy it back.\n\n**Can I return or exchange my items?**\nWe want you to be happy with every order. If something's not right, reach out within three (3) business days of delivery.\n\n*Exchanges*\n- Damaged or not as described: we'll exchange it at no additional cost.\n- \"Damage\" means something that affects the item's metal value. Minor surface marks, light scratches, fingerprints or slight packaging wear are normal and don't count.\n- Any other reason: we're happy to help, but you pay return shipping and insurance.\n\nKeep in mind:\n- Availability: exchanges depend on stock. If the exact item isn't available, we'll help you find a close alternative or a price adjustment for a higher-value replacement.\n- Packaging: send items back in their original packaging.\n- Condition: replacements may vary in wear or circulation status.\n\n*Returns & buybacks*\n- Bullion items are not eligible for refunds, because of how the precious metals market works.\n- Changed your mind? We'll process it as a standard buyback at the current market price, minus return shipping costs.\n- Cool & Collectible items are reviewed case-by-case and may have a restocking fee.\n\n*How to get started*\nMessage us within the 3-day window, ideally with a few photos of the item and packaging.\n- Phone: 1 877 775-4826 or 514 313-9999\n- Email: info@kitco.com","All","All","Can I return or exchange my items?"],		
["Payments","How to Pay","1","How can I pay, in which currencies, and are there discounts?","**Short answer:** Payment is due within three (3) business days. U.S. and Canadian customers can pay by wire, check, card, PayPal, e-check, bill payment, Interac e-Transfer® or Bitcoin. International customers pay by bank wire or cleared funds on account. Some methods get a 4% discount.\n\n**How can I pay for my purchase?**\nHow you can pay depends on where you live (or where your business is based) and how much you're spending.\n\n*First-time U.S. and Canadian customers: limit, currency, hold*\n- Cleared Funds on a Kitco Account (FOA): Unlimited, USD, CAD, EURO, GBP, no hold\n- Bank Wire: Unlimited, USD, CAD, EURO, GBP, no hold\n- Credit Card: $10,000, USD, CAD, no hold\n- PayPal: $10,000, USD, CAD, no hold\n- Bank Check, Bank Draft, Bank Money Order: $25,000, USD, CAD, 3 business days\n- Personal / Company Check: $25,000, USD, CAD, 5 business days\n- E-check: $7,500, USD, 3 business days\n- Online Bill Pay - USA: Unlimited, USD, 5 business days (see note)\n- Online Bill Pay - Canada: Unlimited, CAD, no hold\n- Interac e-Transfer®: $10,000, CAD, no hold\n- Bitcoin: $10,000, USD, no hold\n\nNotes:\n- These limits are for first-time buyers. You can contact us to increase your purchase limit.\n- Euros or pounds sterling can ONLY be used with Bank wire or Cleared funds on a Kitco account (FOA).\n- Some regional U.S. banks mail us a physical check for Online Bill Pay. If yours does, personal check rules apply, so check with your bank first.\n\n*International customers*\n- Bank wire\n- Cleared funds on a Kitco account\n\n*A few quick tips*\n- Use your own bank account.\n- Make sure the name on your payment matches the name on your Kitco account.\n- Send one payment per order. It keeps things simple and gets your order moving faster.\n- Visiting our Montreal counter? You may have a few more options. Call 1 877 775-4826 or book an appointment before you come in.\n\n*Bank wire*\n- Log into your Kitco account. Our banking information is under the profile section. You'll also get the instructions in your order confirmation email.\n- Reference your order number in the note field of your bank wire.\n- Tip: print the instructions and take them to a teller with your order total.\n- We usually receive wires within 1-3 business days. We only accept same-day bank wire payments and no ACH transactions.\n\n*Personal / business checks*\n- Up to $25,000 USD/ CAD, or up to $50,000 USD/ CAD with prior payment history.\n- Holding period: five (5) business days from deposit.\n- U.S. or Canadian Dollars only. Make it out to Kitco Metals Inc., with your name and account number clearly referenced.\n- Incorrectly written checks (wrong or missing date, amount discrepancies, spelling, missing signature, etc.) are returned by regular mail, or by courier for a fee of $30.\n- If your bank returns it (insufficient funds, closed or untraceable account), there's an administrative fee of $35.\n- Fees are in USD for U.S. dollar amounts and CAD for Canadian dollar amounts.\n\n*Bank checks (certified checks, cashier's checks, bank drafts and money orders)*\n- Up to $25,000 USD/ CAD, or up to $50,000 USD/ CAD with prior payment history.\n- Holding period: three (3) business days from deposit.\n- Only money orders issued by banks. We don't accept postal money orders.\n- Drawn in favor of Kitco Metals Inc., with your name and account number. The same return rules and $30 courier fee apply.\n\n*Credit card*\n- Limit of $10,000 or up to $25,000 USD/CAD, depending on shipping address.\n- Kitco Pool or VaultChain: credit card for phone orders only, limited to $1,000 USD/CAD or up to $5,000 USD/CAD.\n- We may need extra verification. Verified orders typically ship within 48 hours.\n\n*PayPal*\n- Limit of $10,000 or up to $25,000 USD/CAD, depending on shipping address.\n- Kitco Pool or VaultChain can't be paid through PayPal.\n- We may need extra verification. Verified orders typically ship within 48 hours.\n\n*Funds on account (FOA)*\nMoney you've sent us that sits in your account, ready for a purchase or to be returned on request. Funds are cleared when there are no holds on them, and they must be cleared to use or return. No limit, and you can hold USD, CAD, EURO, GBP.\n\n*E-check*\nPay straight from your U.S. checking account, with no paper checks. Connect your bank securely through Plaid at checkout or in your Kitco online profile. Up to $7,500 USD, or up to $50,000 USD if you've used it successfully before. Usually clears in 3 business days.\n\n*Online Bill Payment*\n- U.S. bank accounts: all major banks and several regional banks, in USD, with a 5 business day hold.\n- Canadian bank accounts: in CAD through BMO, CIBC, RBC, National Bank, Scotia Bank, TD, Simplii Financial, Laurentian Bank, Desjardins, Tangerine and Manulife.\n\nHow to pay:\n1. Go to the Payments section of your online banking.\n2. Click \"Pay a Bill\", then \"Add a Payee\".\n3. Search \"Kitco\" and select \"Kitco Metals\".\n4. Enter your Kitco account number as the reference.\n5. Complete the payment as your bank instructs.\n\n*Interac e-Transfer®*\nIn Canadian dollars from Canadian banks:\n1. Sign in to your Canadian online banking.\n2. Send the payment to interac@kitco.com.\n3. No security question needed, since Kitco is Auto-Deposit enabled.\n4. In the message, enter the full name and account number on your Kitco account (e.g. Kitco Info John Smith 012345678).\n\n*Bitcoin*\nFor USD orders up to $10,000:\n1. At checkout, select Bitcoin. You'll get an email with a secure payment link.\n2. Click the link and scan the QR code with a supported crypto wallet.\n3. Review the details and send your Bitcoin within 15 minutes of checkout to keep the locked-in exchange rate from Bitpay.\n\nGood to know:\n- Use a wallet that supports the Payment Protocol (see our list of recommended wallets).\n- Pay directly from your wallet. Transactions from exchanges such as Coinbase or Poloniex aren't supported.\n- One full payment per order. Multiple or split payments can't be processed.\n- Once submitted and awaiting blockchain confirmation, a Bitcoin payment cannot be canceled.\n\n**Are there discounts for certain methods of payment?**\nYes! Pay by bank wire, bank check, personal check, online bill payment, or funds on your account and you get a 4% discount. You'll see each payment method's discount on the product details page.\n\n**Can I pay in multiple currencies?**\n- Paying entirely by bank wire: no. You must pay in your transacting currency only.\n- Paying partly by bank wire: the wire part must be in your transacting currency.\n- Paying partly with funds on your Kitco account: you can use U.S. dollars, Canadian dollars, Euros or British pounds.\n\nIf you pay in a different currency from your purchase, we'll convert it at Kitco's daily currency exchange rate.","All","All","How can I pay for my purchase?\nAre there discounts for certain methods of payment?\nCan I pay in multiple currencies?"],		
["Payments","How to Pay","2","Paying by credit card or PayPal","**Short answer:** We accept Visa, MasterCard and PayPal in U.S. or Canadian dollars, up to $10,000 (new accounts) or $25,000 (verified shipping addresses), for U.S. and Canadian residents. It's safe: Kitco is PCI compliant.\n\n**Can I pay for my purchase by Credit Card?**\nYes, with Visa and MasterCard, in U.S. or Canadian dollars:\n- Up to $10,000 for new accounts or a non-verified shipping address\n- Up to and including $25,000 for verified shipping addresses\n- Pool and VaultChain: limited to $1,000 USD/CAD or up to $5,000 USD/CAD, for phone orders only\n- You must reside in the United States or Canada.\n- We can't accept pre-paid credit cards.\n\n**Can I pay for my purchase through PayPal?**\nYes, in U.S. or Canadian Dollars, with the same limits: up to $10,000 for new accounts or a non-verified shipping address, and up to and including $25,000 for verified shipping addresses. You must reside in the United States or Canada. Kitco Pool or VaultChain can't be paid by PayPal.\n\n**What does Kitco need from me when paying by Credit Card or PayPal?**\nSometimes we'll ask for some extra information. This verification step protects both you and Kitco. Prefer to skip it? You can send an alternate method of payment instead. If your card or PayPal was already charged, you'll be reimbursed within 24-48 hours.\n\n**Do I have to give you my credit card number online?**\nYes, when asked. We may need a valid Visa or MasterCard to confirm your price, pay for your purchase, or charge fees like shipping and insurance. We may also charge your card if market loss repayments or other fees become payable.\n\nWe use advanced security to protect your personal data, and Kitco is PCI compliant (https://www.pcisecuritystandards.org/). Prefer not to share it online? Call 1 877 775-4826 or 514 313-9999, 8:30 a.m. to 10:00 p.m. ET, Monday to Thursday, and 8:30 a.m. to 5:00 p.m. ET Friday.\n\n**Is it safe to buy precious metals with a credit card?**\nYes, it's both safe and convenient. Kitco is PCI Compliant (Payment Card Industry Data Security Standard), and some orders get a manual review for your protection, which reduces the risks of using your card online.","All","All","Can I pay for my purchase by Credit Card?\nCan I pay for my purchase through PayPal?\nWhat does Kitco need from me when paying by Credit Card or PayPal?\nDo I have to give you my credit card number online?\nIs it safe to buy precious metals with a credit card?"],		
["Payments","How to Pay","3","Can I pay for my purchase in cash?","**Short answer:** Yes, but only at our Montreal Counter, in U.S. dollars, Canadian dollars or Euros, and only for orders you're picking up.\n\n**Can I pay for my purchase in cash?**\nYes, with a few limits:\n- Cash is accepted only at our Montreal Counter (open 8:30 a.m. to 4:00 p.m. ET, Monday to Friday).\n- U.S. dollars, Canadian dollars or Euros only. Pound sterling payments cannot be made in cash.\n- Maximum of $40,000 CAD, $30,000 USD or €26,000 EUR per day and per transaction.\n- At least 50% of the notes should be $50 and $100 USD/CAD, or €100, €200, €500 EUR.\n- Any order, including online or phone orders, can be paid fully or partially in cash, as long as you're picking it up at our Montreal Counter. Orders being delivered to you cannot be paid for in cash.","All","All","Can I pay for my purchase in cash?"],		
["Payments","Sending Payment & Wire Instructions","1","Where do I send payment, and can a third party pay?","**Short answer:** Make all payments out to Kitco Metals Inc. Wire details are in your account and confirmation email, and checks go to our Montreal or Rouses Point, NY office. The payment must come from you, since we don't accept third-party payments.\n\n**Where and in what name should I send my payment?**\n- Funds on your account: nothing to send. We'll deduct what you owe from your funds on your Kitco account.\n- Bank wire: the beneficiary is Kitco Metals Inc. Full instructions (address, account number, etc.) appear on the Transaction Processing page at checkout and in your confirmation email.\n\nTo speed things up:\n1. Log in to your Kitco account and get the bank wire information from the profile section.\n2. Print the bank wire instructions.\n3. Confirm the total amount due to Kitco with your financial institution.\n\nWe usually receive wires within 1-3 business days. We only accept same-day bank wire payments and no ACH transactions.\n\n- Personal or company check: make it out to Kitco Metals Inc. and include your name and Kitco account number (see check example). Mail it to:\n\nCanadian Residents:\nKitco Metals Inc.\n620 Cathcart, Suite 900\nMontreal, QC H3B 1M1\nCanada\n\nUS Residents:\nKitco Metals Inc.\n64 Lake Street, Suite 101\nRouses Point, NY 12979\nUSA\n\n**Does Kitco Accept Third Party Payments?**\nNo. To keep transactions safe and secure, we don't accept funds from a third party. The name on the payment account must match the Kitco account holder name. Third-party payments will be returned within 7-10 business days.","All","All","Where and in what name should I send my payment?\nDoes Kitco Accept Third Party Payments?"],		
["Payments","Sending Payment & Wire Instructions","2","Wire instructions and intermediary bank fees","**Short answer:** Wires are accepted in USD, CAD, Euros and Pound sterling, and checks up to $25,000 in USD or CAD. For international wires, add about U.S. $25 to cover intermediary bank fees.\n\n**Payment instructions by currency / method**\n*Bank wire*\nWe accept bank wires in American dollars, Canadian dollars, Euros and Pound sterling from North American and International banks. After you order, your confirmation email will walk you through it:\n1. Log in to your Kitco account and get the bank wire information from the profile section.\n2. Print the bank wire instructions.\n3. Confirm the total amount due to Kitco with your financial institution.\n4. Enter your Kitco account number as reference.\n\nWe usually receive wires within 1-3 business days. We only accept same-day bank wire payments and no ACH transactions.\n\n*Checks*\nWe accept checks up to $25,000* in American and Canadian dollars from North American banks:\n- Personal Check, Company Check, Certified Check\n- Bank Draft, Cashier's Check, Teller's Check\n- Official Check, Bank Money Order\n\n*Exceptions may apply. See Payments and Fees, and follow the Check instructions (USD & CAD) document.\n\n**What are intermediary bank fees? How much should I send to cover these costs?**\nMost international wires pass through at least one intermediary bank, and that bank, not yours or ours, charges a fee. Tell your bank the exact amount that should reach Kitco, and they can tell you how much extra to send. Usually, an additional U.S. $25 should be enough.","All","All","What are intermediary bank fees? How much should I send to cover these costs?\nPayment instructions by currency / method"],		
["Payments","Purchase Cancellations & Market Loss","1","Cancelling a purchase: policy, market loss and late payment","**Short answer:** Cancelling a purchase always costs a $99.95 administrative fee. If prices have dropped since you bought, you also pay the market loss. Payment is due within three business days.\n\n**What is your cancellation policy with respect to the purchase of precious metal bullion products?**\n- Every cancelled purchase: $99.95 administrative fee.\n- Price went up or stayed the same: no additional charge.\n- Price fell below your purchase price: Kitco has a market loss, and you pay the drop in your purchase's total value plus the $99.95 administrative fee.\n\n**How do you calculate market loss repayments for the purchase of precious metal bullion products?**\nMarket loss = (price at cancellation − your purchase price) × quantity, charged only if it's a loss.\n- Example 1: bought 10 oz at $1000.00, cancelled at $980.00. ($980 - $1000) x 10 = -$200, so you repay $200.00.\n- Example 2: bought 10 oz at $1000.00, cancelled at $1050.00. ($1050 - $1000) x 10 = +$500, so you repay $0.00.\n\nWhich price is used:\n- You cancel before the payment deadline: the Kitco live spot price at the time you request the cancellation.\n- Cancelled for non-payment (after multiple payment reminders): the London Bullion Market Association price fixing (the London PM Fix) on the day the payment deadline expires.\n\nAny market loss repayment and fees may be charged to your credit card, and we'll email you about the charge.\n\n**What happens if my payment does not reach Kitco by the stipulated deadline?**\nYour payment must reach us within three business days of your price being confirmed. If it doesn't, Kitco may cancel your purchase, and you may owe market loss repayments and other fees (see our Terms and Conditions). Expecting a delay? Call 1 877 775-4826 or 514 313-9999 so we can note it on your account.","All","All","What is your cancellation policy with respect to the purchase of precious metal bullion products?\nHow do you calculate market loss repayments for the purchase of precious metal bullion products?\nWhat happens if my payment does not reach Kitco by the stipulated deadline?"],		
["Payments","Sale Cancellations & Market Loss","1","Cancelling a sale: policy and market loss","**Short answer:** Cancelling a sale always costs a $99.95 administrative fee. If prices have risen since you sold, you also pay the market loss. If we don't receive your metal within 10 business days, the sale is cancelled.\n\n**What is your cancellation policy with respect to the sale of precious metal bullion products?**\n- If we don't receive your product within 10 business days of confirming the price, the sale is cancelled.\n- Every cancelled sale: $99.95 administrative fee.\n- Price fell or stayed the same: no additional charge.\n- Price rose above your sale price: Kitco has a market loss, and you pay the increase in your sale's total value plus the $99.95 administrative fee.\n- Sent less than you confirmed (lower weight, purity or value)? The deficit is treated as a cancellation, with the usual policy, including the $99.95 administrative fee.\n\n**How do you calculate market loss repayments for the sale of precious metal bullion products?**\nMarket loss = (your sale price − price at cancellation) × quantity, charged only if it's a loss.\n- Example 1: sold 10 oz at $1000.00, cancelled at $950.00. ($1000 - $950) x 10 = +$500, so you repay $0.00.\n- Example 2: sold 10 oz at $1000.00, cancelled at $1020.00. ($1000 - $1020) x 10 = -$200, so you repay $200.00.\n\nWhich price is used:\n- You cancel before the shipment deadline: the Kitco live spot price at the time you request the cancellation.\n- Cancelled by Kitco (after multiple shipment reminders): the London Bullion Market Association price fixing (the London PM Fix) on the day the deadline for receiving your metals expires.\n\nAny market loss repayment and fees may be charged to your credit card, and we'll email you about the charge.","All","All","What is your cancellation policy with respect to the sale of precious metal bullion products?\nHow do you calculate market loss repayments for the sale of precious metal bullion products?"],

<script>		
var D=[		
["How To Buy","What You Can Buy","1","What can I buy, and is there a minimum order?","**Short answer:** Gold, silver, platinum, palladium and rhodium coins and bars, for delivery or storage. Physical bullion orders start at $5,000; storage accounts and collectibles have no minimum.\n**What precious metal products can I buy from Kitco’s online store?**\nGold, silver, platinum, palladium and rhodium coins and bars, delivered to you or held in storage.\n**Coins and bars from trusted makers, including:**\n- The United States Mint\n- The Royal Canadian Mint\n- The Perth Mint\n- The Austrian Mint\n- Many other reputable refiners\n**Don't want metal at home? Buy it for storage instead:**\n- Kitco Pool - Metal Account: unallocated storage. You own an amount of metal in a shared pool. It's the simplest, lowest-cost option and easy to sell later.\n- Kitco Allocated Storage: allocated storage. Specific bars and coins are set aside in your name.\n**Next step:** Browse everything we carry in the “Buy from Kitco” section of our online store.\n**Is there a minimum amount of precious metals that I must buy?**\nYes, for physical bullion it's $5,000. Storage accounts and collectibles have no minimum.\n**Physical bullion (coins and bars shipped to you or picked up)**\n- Online and phone orders: $5,000 CAD/USD\n- Montreal counter orders and pickups: $5,000 CAD/USD\n**Everything else**\n- Kitco Metal Accounts: no minimum\n- Cool & Collectibles: no minimum\n- VaultChain™: rules are different. See VaultChain™ Gold & Silver for details.\n**Tip:** Want to start smaller than $5,000? A Kitco Metal Account lets you buy any amount and switch to physical coins or bars later.","All","All","What precious metal products can I buy from Kitco’s online store?\nIs there a minimum amount of precious metals that I must buy?"],		
["How To Buy","How to Place an Order","1","How can I buy precious metal bullion products from Kitco?","**Short answer:** Open a free Kitco account, then order online, by phone or through chat, whichever is easiest for you.\n**Step 1: Open your account**\nSee “How do I open a Kitco account?” for a quick walkthrough. You'll need to open a Kitco account before your first order.\n**Step 2: Place your order, whichever way suits you**\n- Online: our store is open 24 hours a day, 365 days a year. Prices update live, so what you see is what you pay.\n- By phone: call 1 877 775-4826 or 514 313-9999. We're available Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET.\n- By chat: click the Chat button on our website to order with a member of our team.\n**Tip:** Not sure what to buy? Call or chat with us. Our team is happy to talk you through the options.","All","All","How can I buy precious metal bullion products from Kitco?"],		
["How To Buy","Pricing & Deposits","1","When is my price confirmed, and do I need a deposit?","**Short answer:** Your price is locked in the moment you place your order. Most orders just need a Visa or MasterCard on file; a deposit only applies to larger amounts.\n**When is a price confirmed?**\nThe moment you place your order, online, by phone or through chat.\n**Why it matters**\nMetal prices move all day. Our website shows live prices that follow the spot market (the current trading price of the metal). Once your order goes through, your price is locked in, even if the market moves a minute later.\n**One thing to check**\nDepending on the value of your order, you may need a deposit or a card on file before your price can be locked in. See the next section to find out if that applies to you.\n**When is a deposit of funds required to buy precious metals? Do I need to pay to confirm a price?**\nUsually not. For most orders, a Visa or MasterCard number is all you need. A deposit only kicks in for larger amounts.\n**How it works**\nWe look at the total value of your open transactions*. That's this purchase plus any other orders or sales that aren't finished yet. Then we check which band you fall into:\n**If you live in the US or Canada**\n- Up to $50,000: no deposit. Just give us a valid Visa or MasterCard number†.\n- Over $50,000 and up to $100,000: 15% of the total in cleared funds‡. We may also ask for a card number†.\n- Over $100,000: 25% of the total in cleared funds‡. We may also ask for a card number†.\n**If you live anywhere else**\n- Up to $20,000: no deposit. Just give us a valid Visa or MasterCard number†.\n- Over $20,000 and up to $100,000: 15% of the total in cleared funds‡. We may also ask for a card number†.\n- Over $100,000: 25% of the total in cleared funds‡. We may also ask for a card number†.\n**Example:** You live in Canada and want to buy $60,000 of gold, with nothing else open. That's over $50,000, so you'd need $9,000 (15%) in cleared funds before your price is locked in.\n**The fine print, in plain English**\n- *Open transactions: all your outstanding or incomplete purchases and sales, plus this purchase. Sales of Kitco Pool, VaultChain™ or Kitco Allocated Storage don't count. We use U.S. dollars if your purchase is in U.S. dollars; other currencies are converted to U.S. dollars and rounded up to the nearest $1,000.\n- †Your card: we only use it to confirm your price and, at Kitco’s discretion, to cover any market loss charges or other fees that come up. It's a safety net, not a payment.\n- ‡Cleared funds: money on your Kitco account with no holds on it, or a Kitco Pool, VaultChain™ or Kitco Allocated Storage holding that's fully paid for with no outstanding claims.\n- Payment checks: to comply with anti-money laundering and counter-terrorist financing rules, we review incoming payments and may ask for information or documents to clarify the source of your funds.\n**Tip:** Planning a big purchase? Add funds to your account first so your price can be locked in right away.","All","All","When is a price confirmed?\nWhen is a deposit of funds required to buy precious metals? Do I need to pay to confirm a price?"],		
["How To Sell","What You Can Sell","1","What can I sell, and is there a minimum?","**Short answer:** Anyone can sell us bullion (bars, coins, rounds and Kitco Rhodium Sponge). Physical products have a $5,000 minimum, digital products have none, and we may buy items even if they're not on our sell page.\n**What products can I sell to Kitco?**\nAnyone can sell us bullion. Only certain businesses can sell us scrap.\n**Bullion: anyone can sell**\nIndividuals, businesses or trusts can sell us bars, coins, rounds and Kitco Rhodium Sponge.\n**Scrap: businesses only**\nWe only buy scrap (jewelry, watches, metal filings, silver tableware, decorative items, dental gold and silver, etc.) from businesses whose work has a logical link to it. Examples include jewelers, pawn shops, antique dealers, manufacturers and dental laboratories. Individuals can't sell us scrap.\n**Not sure which you have?** If it's a recognized coin, bar or round, it's bullion. Jewelry and other items are scrap.\n**Next step:** This section covers bullion. For scrap, see our Selling scrap metal FAQs or call 1 877 775-4826 (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET).\n**Is there a minimum amount of precious metals that I must sell?**\nIt depends on what you're selling.\n- Bullion and other physical products: $5,000 minimum\n- Digital products (Kitco Pool - Metal Accounts and VaultChain™): no minimum, so you can sell any amount\n**Tip:** Have less than $5,000 in coins or bars? Call us to talk about your options.\n**I do not see the item(s) I have listed on your sell page. Will you still buy my items?**\nProbably yes! Our sell page only lists the most popular items.\n**Why it might be missing**\nOur Popular Products pages show the most commonly sold items. Yours may fall under our Other Products list instead. That covers miscellaneous lower-purity bars, coins and rounds, plus junk silver coins.\n**Find out if we can buy it**\n- Call us at 1 877 775-4826 or 514 313-9999, or\n- Email info@kitco.com with detailed pictures of your item.\n**Ship it without the market risk**\nYou can place a pending transaction, where your price is confirmed once we receive and verify your metal. That way you're not responsible for any potential market loss while it's in transit.","All","All","What products can I sell to Kitco?\nIs there a minimum amount of precious metals that I must sell?\nI do not see the item(s) I have listed on your sell page. Will you still buy my items?"],		
["How To Sell","How to Sell","1","How do I sell my coins or bars to Kitco?","**Short answer:** Create a packing slip online, print it, and ship your items to us. It takes about five minutes.\n**Selling online, step by step**\n1. Check that what you're selling is a coin or bar.\n2. Find it in our list of products we buy.\n3. Click Create packing slip.\n4. Print two copies: one for your records and one to put inside the box.\n5. Ship your package to the address on the packing slip.\n**Selling something big?** Large bars (100 oz or 400 oz gold) and Kitco Rhodium Sponge can only be sold by phone. Call 1 877 775-4826 or 514 313-9999.\n**Next step:** Find out when your price is locked in under “When is the price of my sale confirmed?”. Questions? Call us at 1 877 775-4826 or 514 313-9999.","All","All","How do I sell my coins or bars to Kitco?"],		
["How To Sell","Pricing & Deposits","1","When is my sale price confirmed?","**Short answer:** You choose when your sale price is locked in, and you can even ship before confirming a price.\n**When is the price of my sale confirmed?**\nYou pick. Lock it in when you call, when you create your packing slip, or when we receive your items.\n**Your three options**\n- When you call us to make your sale\n- While you create your packing slip online\n- When we receive your items*. You'll get the market price on the day it arrives.\n**Important: keep your locked price safe**\nWe only guarantee the price on your packing slip if your package is:\n- Postmarked within one business day of confirming your price, and\n- Received by Kitco within 10 business days\n**Tip:** Lock in your price only when you're ready to ship that same day or the next.\n*Selling anything from our Other Products list? Then your price can only be confirmed once we receive and verify your shipment.\n**Can I ship my coins and bars to Kitco without confirming a price?**\nYes! You can ship your bullion without confirming a price, and decide on your price later.\n**How it works**\n- No price locked in? We'll use the market price at the time we receive your package.\n- Changed your mind while it's on its way? You can still lock in a price while your package is on its way, unless you're selling items from our Other Products list.\n**Another option: keep your metal, just not at home**\nWe can convert your bullion into Kitco Pool. You can hold it indefinitely, keep an eye on the market, and sell online whenever the price is right. You don't have to store or insure anything yourself.","All","All","When is the price of my sale confirmed?\nCan I ship my coins and bars to Kitco without confirming a price?"],		
["How To Sell","Pricing & Deposits","2","When is a deposit of funds required to make a sale? Do I need to pay to confirm a price?","**Short answer:** Usually not. For most sales, a Visa or MasterCard number is all you need. A deposit only kicks in for larger amounts.\n**How it works**\nWe look at the total value of your open transactions*. That's this sale plus any other sales or orders that aren't finished yet. Then we check which band you fall into:\n**If you live in the US or Canada**\n- Up to $50,000: no deposit. Just give us a valid Visa or MasterCard number†.\n- Over $50,000 and up to $100,000: 15% of the total in cleared funds‡. We may also ask for a card number†.\n- Over $100,000: 25% of the total in cleared funds‡. We may also ask for a card number†.\n**If you live anywhere else**\n- Up to $20,000: no deposit. Just give us a valid Visa or MasterCard number†.\n- Over $20,000 and up to $100,000: 15% of the total in cleared funds‡. We may also ask for a card number†.\n- Over $100,000: 25% of the total in cleared funds‡. We may also ask for a card number†.\n**Example:** You live in Canada and want to sell $60,000 of gold, with nothing else open. That's over $50,000, so you'd need $9,000 (15%) in cleared funds before your price is locked in.\n**The fine print, in plain English**\n- *Open transactions: all your outstanding or incomplete purchases and sales, plus this sale. Sales of Kitco Pool, VaultChain™ or Kitco Allocated Storage don't count. We use U.S. dollars if your sale is in U.S. dollars; other currencies are converted to U.S. dollars and rounded up to the nearest $1,000.\n- †Your card: we only use it to confirm your price and, at Kitco’s discretion, to cover any market loss charges or other fees that come up. It's a safety net, not a payment.\n- ‡Cleared funds: money on your Kitco account with no holds on it, or a Kitco Pool, VaultChain™ or Kitco Allocated Storage holding that's fully paid for with no outstanding claims.\n**Tip:** Planning a big sale? Add funds to your account first so your price can be locked in right away.","All","All","When is a deposit of funds required to make a sale? Do I need to pay to confirm a price?"],		
["How To Sell","Shipping & Drop-off","1","How do I get my items to Kitco?","**Short answer:** Ship with Kitco’s help (US and Canada), ship it yourself with a courier, or drop it off at one of our locations by appointment.\n**How should I ship my items to Kitco?**\nIn the US or Canada, let us arrange it. It's usually the fastest, safest and cheapest way.\n**Before anything else: pack it right**\nFollow our shipping instruction sheet or watch our short video on preparing your shipment.\n**Option 1: Ship with Kitco’s help (US and Canada only)**\nChoose this when you process your sale online or by phone.\n- Cost for standard packages (up to 50 pounds or $100,000 in value): $35 flat rate for shipping, plus $6.50 per $1,000 of product to insure gold, silver, platinum, palladium and rhodium.\n- Example: shipping $20,000 of silver costs $35 + $130 insurance = $165.\n- Paying: by credit card, or have it deducted from your payout.\n- Pickup or drop-off: we can arrange a pickup from the address on your account, or you can drop it off at the courier yourself. Chose drop-off and changed your mind? Call 1 877 775-4826 or 514 313-9999 to book a pickup.\n**Large or unusual packages**\nFor 500-coin Monster Boxes, 100 oz or 400 oz gold bars, more than 700 oz of product, or more than $100,000 worth, costs are usually higher and it can't be arranged online. Call 1 877 775-4826 or 514 313-9999. Call the same number if you're shipping from outside the US or Canada.\n**Option 2: Ship it yourself**\nWe strongly recommend a courier like FedEx or UPS, and insuring your package. To keep it secure:\n- Use new, shipping-grade boxes.\n- Pack items snugly in a strong box, then put that box inside a slightly larger one (double boxed).\n- Keep the outside plain, with nothing that hints at what's inside or what it's worth.\n**Can I drop my package off at one of your physical locations?**\nYes. We have drop-off locations in the northeastern United States and Canada.\n**Before you go**\n- Book first: call 1 877 775-4826 or 514 313-9999 to make an appointment.\n- Fees: depending on the location, there may be a drop-off fee of up to $70 per package.\n- Check your items: some locations may not accept drop-offs of certain items, so mention what you're bringing when you call.\n**Tip:** Shipping with Kitco’s help can cost less than a drop-off fee. See the shipping options above.","All","All","Can I drop my package off at one of your physical locations?\nHow should I ship my items to Kitco?"],		
["How To Sell","Getting Paid","1","How and when will I get paid?","**Short answer:** Choose a check, bank wire, bullion or account credit. We usually send payment within 24 to 48 hours of verifying your items.\n**How will I be paid for precious metal bullion products that I sell to Kitco?**\nYour choice: check, bank wire, bullion, or a credit to your Kitco account. Several options are free.\n**Free options**\n- Check by regular mail (US and Canadian customers only)*\n- Bullion products we normally carry\n- Credit to the funds on your Kitco account\n- Credit to your Kitco Pool account\n**Options with a fee**\n- Check by courier: $30 (US and Canadian customers only)*\n- USD or CAD wire to a bank in the USA or Canada: $40†\n- USD or CAD wire to a bank outside the USA and Canada: $60. We pay all intermediary bank fees.\n- GBP or EUR wire: £50/€60‡\n**Good to know**\n- *Checks are only available for USD or CAD payments to US and Canadian residents.\n- †Wiring across the border (a US resident to a Canadian bank, or a Canadian resident to a US bank)? International wire fees apply.\n- †Wires to Canada must include the beneficiary’s full address. PO Boxes aren't accepted, and missing details can get your payment delayed or rejected.\n- ‡GBP or EUR payments can only be made by bank wire or as a credit to funds on your account.\n**Tip:** Want your money fast? A domestic bank wire usually arrives in 1-2 business days.\n**How long will it take for me to receive my payment?**\nUsually within a few days of your package arriving. How fast depends on how you choose to be paid.\n**What happens after your package arrives**\n1. We verify your items. We aim to finish within 48 hours of delivery. Sales volumes are high right now, so it may occasionally take a little longer. Thanks for your patience!\n2. We send your payment, usually within 24 to 48 hours of verifying.\n3. The money reaches you. Depending on how you're paid, this can take up to 10 business days:\n- Domestic bank wire: 1-2 business days (fastest)\n- International bank wire: 2-5 business days\n- Check by courier: 2-3 business days\n- Check by regular mail: 10-15 business days\n**What can slow things down**\nA discrepancy in your order, U.S. or Canadian statutory holidays, extraordinarily high market activity, very high-value sales, or events outside our control like transport strikes or natural disasters.","All","All","How will I be paid for precious metal bullion products that I sell to Kitco?\nHow long will it take for me to receive my payment?"],		
["Your Kitco Account","Opening an Account","1","How do I open an account?","**Short answer:** Individual accounts can be opened online or by phone. Joint, minor, business and trust accounts use an application form plus a few documents — we open your account as soon as they're approved.\n\n**How do I open an individual account?**\nAn individual account is controlled by one person, with no third party involvement.\n- **Online:** make your first purchase or sale and create your account at checkout. Or fill in the Individual Account Online Application Form before placing your transaction.\n- **By phone:** call 1 877 775-4826 or 514 313-9999 and we'll set up your account and your first purchase.\n\n**How do I open a joint account?**\nA joint account is shared by a maximum of two people and owned equally by both. You'll need to be either:\n- spouses (marriage, civil union or common-law relationship), or\n- a parent and adult child (18 years old and older)\nDownload the Kitco Joint Account Application Form from the Create Account page of our online store, then follow the steps below.\n\n**How do I open a minor's account? (for persons aged less than 18 years)**\nThe account is in the minor's name and managed by a legal guardian until the minor reaches legal age. Use the Kitco Account Application Form for a Minor from the \"Open an Account\" page.\n\n**How do I open a business account?**\nThe account is in your business's name, and appointed individual(s) fund, transact and manage it on the business's behalf. You'll need a business account to transact in refining and scrap. Use the Kitco Business Account Application Form from the \"Open an Account\" page.\n\n**How do I open an account for an existing trust?**\nThe account is in the trust's name and managed by the individual(s) appointed in the trust documents. Use the Kitco Account Application Form for an Existing Trust from the \"Open an Account\" page.\n\n**Steps for joint, minor, business and trust accounts**\n1. Download and fill in the right application form.\n2. Send us the required documents as instructed in the form.\n3. As soon as your documents are received and approved, we'll open your account.\n\nQuestions? Call 1 877 775-4826 or 514 313-9999.","All","All","How do I open an individual account?\nHow do I open a joint account?\nHow do I open a minor's account? (for persons aged less than 18 years)\nHow do I open a business account?\nHow do I open an account for an existing trust?"],		
["Your Kitco Account","Managing Your Account","1","How do I find or update my account details?","**Short answer:** Your account number shows up as soon as you sign in. You can update most details yourself in \"My Profile\" — but if your balance or holdings are over $500 CAD, address changes need a quick call.\n\n**What is my Kitco Account Number? How do I locate it?**\nIt's the unique number we use to identify your account. Sign into your account and you'll see it in the welcome message at the top of the screen.\n\n**How do I change my account information?**\n- **Balance or holdings under $500 CAD:** log into \"My Kitco Account\", go to the \"My Profile\" tab and update your residential address, phone number or email. Click \"Submit\" to save.\n- **Balance or holdings over $500 CAD:** you can still update your phone number and email online. For address changes, call us at 1-877-775-4826 or 514-313-9999.","All","All","What is my Kitco Account Number? How do I locate it?\nHow do I change my account information?"],		
["Your Kitco Account","Managing Your Account","2","Can I add a relative or friend to my account or provide them access to it?","**Short answer:** Yes! You can add a relative or friend and give them access — you'll just need to submit some specific documents.\n\n**Can I add a relative or friend to my account or provide them access to it?**\nYes. Adding someone requires specific documents. Give us a call at 1 877 775-4826 or 514 313-9999 and we'll walk you through it.","All","All","Can I add a relative or friend to my account or provide them access to it?"],		
["Your Kitco Account","Managing Your Account","3","Where can I see my balance, transactions and statements?","**Short answer:** Just sign into your account — your balances, full transaction details and a 24-month history are all there. We don't mail paper statements by default.\n\n**Where can I see my account balance?**\nSign into your account. In the \"Order History\" table (top right corner), you'll see two amounts, sorted by currency:\n- **Balance of Cleared Funds** — the total amount of money remaining in your account\n- **Amount Outstanding** — any balance that may be due on your account\n\n**How can I see the details of my transactions?**\nSign into your account and click any transaction number to see all its details.\n\n**Will I receive paper statements in the mail for each transaction I make?**\nNot by default — Kitco doesn't send paper statements or invoices. Instead, we keep a 24-month record of all your transactions online, and you can view a printer-friendly summary of any of them whenever you sign in.","All","All","Where can I see my account balance?\nHow can I see the details of my transactions?\nWill I receive paper statements in the mail for each transaction I make?"],		
["Your Kitco Account","Funds on Account","1","Do funds on my account earn interest, and how do I withdraw them?","**Short answer:** Funds on your account don't earn interest. To withdraw them, just give us a call — you can get a check (U.S. & Canada) or a bank wire.\n\n**Do funds held on my account accrue interest?**\nNo, funds held on account with Kitco do not accrue interest.\n\n**How can I withdraw the funds on my account?**\nCall 1 877 775-4826 or 514 313-9999 to request a refund of all or part of your funds. Your options depend on your country of residence (or the location of your principal place of business):\n- **Check by regular mail** — free (U.S. & Canada only)\n- **Check by courier** — $30 (U.S. & Canada only)\n- **USD or CAD bank wire to a bank in the USA or Canada** — $40 (all customers)\n- **USD or CAD bank wire to a bank outside the USA and Canada** — $60 (all customers). Kitco pays all intermediary bank fees.\n- **GBP or EUR bank wire** — £50/€60 (all customers)\n\nGood to know:\n- Checks can only be sent for USD or CAD funds to US/Canadian residents.\n- Funds in GBP or EUR can only be refunded by bank wire.","All","All","Do funds held on my account accrue interest?\nHow can I withdraw the funds on my account?"],		
["Your Kitco Account","Funds on Account","2","How and why should I add funds to my account ahead of time?","**Short answer:** Adding funds ahead of time (prefunding) lets you lock in prices instantly and buy more. Bank wire works everywhere; Canadians can also use Interac e-Transfer or Online Bill Payment, and U.S. and Canadian customers can mail a check.\n\n**Why Add Funds to Your Account Ahead of Time?**\nYou'll be ready to act when the moment's right:\n- **Lock in prices instantly** when the market moves your way\n- **Faster orders** — no waiting for payments to clear\n- **More buying power** — go bigger when opportunities arise\n\n**How to Add Funds to Your Account?**\nHere's how long each method holds your funds:\n- **Bank wire** — no hold time (USD/CAD, EUR/GBP)\n- **Interac e-Transfer** (CAD only) — no holding period\n- **Online Bill Payment** (CAD only) — no holding period\n- **Personal/business check** — 5 business-day hold\n- **Certified/bank check, bank draft or bank-issued money order** — 3 business-day hold\nChecks, drafts and money orders are for USD/CAD up to $25,000. Over $25,000, use bank wire, Interac e-Transfer or Online Bill Payment. EUR/GBP can only be sent by bank wire.\n\n**Which Prefund Methods can I use?**\n✔ **Bank Wire Transfer (All Regions)**\nLog in to your Kitco account and go to the How to Add Funds section for our wire instructions.\n\n✔ **Interac e-Transfer (Canada Only)** — New!\n1. Log in to your Canadian online banking account.\n2. Send the payment in CAD to interac@kitco.com — no security question needed (Kitco is Auto-Deposit enabled).\n3. In the message field, include your Kitco account name and account number. Example: Kitco Info John Smith 012345678\nKitco doesn't set a transfer limit, but your bank may have one.\n\n✔ **Online Bill Payment (Canada Only)**\nPay in CAD at BMO, CIBC, RBC, National Bank, Scotia Bank, TD, Simplii Financial, Laurentian Bank, Desjardins, Tangerine or Manulife:\n1. Go to the Payments section of your online bank account.\n2. Click \"Pay a Bill\", then \"Add a Payee\".\n3. Search \"Kitco\" and select \"Kitco Metals\".\n4. Enter your Kitco account number as the reference and complete your payment.\n\n✔ **Checks and Bank Drafts (U.S. and Canada Only)**\nAccepted up to $25,000:\n- Personal or business check (5-day holding period)\n- Certified check / Cashier's check / Official check (3 day hold)\n- Bank draft (3 day hold)\n- Bank-issued money order (3 day hold)\nNot accepted: postal money orders or third-party checks.\nMake checks payable to Kitco Metals Inc. and include your Kitco account number on the check. Mail to:\n- **Canadian Residents:** Kitco Metals Inc. 620 Cathcart, Suite 900, Montreal, QC H3B 1M1, Canada\n- **U.S. Residents:** Kitco Metals Inc. 64 Lake Street, Suite 101, Rouses Point, NY, 12979, USA\n\n**How Can I Unlock Greater Buying Power?**\nWithout funds on account, you can lock in:\n- U.S. & Canada: up to $50,000\n- International: up to $20,000\nWith prefunding:\n- A 15% deposit of your order value raises your limit to $100,000\n- A 25% deposit raises your limit to $250,000 — no full prepayment needed\nMore flexibility, higher limits and greater peace of mind.","All","All","Why Add Funds to Your Account Ahead of Time?\nHow to Add Funds to Your Account?\nWhich Prefund Methods can I use?\nHow Can I Unlock Greater Buying Power?"],		
["Your Kitco Account","Sign-in & Security","1","Trouble signing in? Passwords and account security","**Short answer:** Double-check your details and Caps Lock, use \"Reset Password\" if you've forgotten it, or give us a call. Your password is protected with hashing, so it's never stored as-is.\n\n**I cannot sign into my account. What should I do?**\n- Make sure your username/email address and password are exactly as you entered them when you created your account.\n- Passwords are case-sensitive — check that Caps Lock isn't on.\n- Still stuck? Call 1 877 775-4826 or 514 313-9999.\n\n**How do I reset a forgotten password? What should I do if I have forgotten both my username and password?**\n- **Forgot your password:** click the \"Reset Password\" link in the top menu and follow the step-by-step instructions.\n- **Forgot both your username and password:** call 1 877 775-4826 or 514 313-9999.\nFor security reasons, we cannot provide any sign-in information by email.\n\n**Is my Kitco account password secure?**\nYes. Kitco has always used a security method called 'hashing' for all online store passwords. It turns your password into a one-of-a-kind cryptogram that's irreversible — so your password stays secure and private. Only this hash, not your actual password, is stored.","All","All","I cannot sign into my account. What should I do?\nHow do I reset a forgotten password? What should I do if I have forgotten both my username and password?\nIs my Kitco account password secure?"],		
["Bullion Products","Product Info & Terms","1","Bullion vs. numismatic coins, condition and grading","**Short answer:** We sell bullion — coins and bars valued for the metal they contain. Most of our stock is circulated, so scratches or minor dents are normal and never affect the metal value.\n\n**What is the difference between precious metal bullion and numismatic coins?**\nKitco only sells bullion coins (and bars), which are traded for the value of the precious metal they contain. Numismatic coins get their value from their condition, vintage, rarity, history and collectability — you'd usually buy those from a coin dealer rather than a bullion dealer.\n\n**Do you sell mint-condition or proof coins? Can I request new (uncirculated) coins?**\nNot always. Our stock includes coins straight from national mints plus coins sold to us by individual customers. We do sell some new or uncirculated coins, but we cannot guarantee that the coins you receive will be new. Since bullion value is based on metal content, the condition (new or pre-circulated) doesn't affect market value.\n\n**What are the different gradings of coins and bars?**\n- **Circulated** (most of our bullion): sourced from national mints or bought from individual customers. May have scratches and minor dents, and bubbles are common in bullion bars.\n- **Uncirculated — MintFirst:** gold and silver coins sourced directly from national mints to Kitco, then sent to you. May have hairline scratches or fine prints from handling during production or packaging.\n- **Brilliant uncirculated** (many Cool & Collectible items): produced and packaged by the mints and refiners themselves, sometimes in special packaging. Standards vary between mints and refiners, but minor imperfections are normal.\nNone of these marks — or any imperfections on packaging — affect the metal value of the item.","All","All","What is the difference between precious metal bullion and numismatic coins?\nDo you sell mint-condition or proof coins? Can I request new (uncirculated) coins?\nWhat are the different gradings of coins and bars?"],		
["Bullion Products","What You Can Buy","1","Can I request specific products, refiners or years?","**Short answer:** Generally no — we can't guarantee a specific refiner, year or condition. If you want a guaranteed year, check out our MintFirst coins. And if you don't see what you want online, give us a call — we often have more in stock.\n\n**Can I buy bullion bars from a specific refiner or bullion coins from a specific year?**\nKitco mostly sells circulated bullion coins and bars, so we cannot guarantee the availability of a specific refiner, year or condition. That's okay: the market value doesn't depend on the manufacturer, year of mintage or appearance, and minor blemishes and regular wear and tear don't reduce value. You'll get full market value regardless of age or manufacturer.\n\nWant a specific year? **MintFirst** coins have never been previously owned, come in capsules or tubes to prevent major scratches and dents, and guarantee the current or previous year of production. The exact year is shown in the product description, so you'll know before you buy.\n\n**Do you sell precious metal bullion products not listed on your website?**\nOften, yes! For things like different ounce size bars or bullion coins from Australia and China, call 1 877 775-4826 or 514 313-9999.","All","All","Can I buy bullion bars from a specific refiner or bullion coins from a specific year?\nDo you sell precious metal bullion products not listed on your website?"],		
["Bullion Products","What You Can Buy","2","Do the bars that you sell include assay certificates?","**Short answer:** Usually not — most manufacturers don't issue them. Every bar is stamped with its maker, weight and purity, and that's what dealers worldwide rely on.\n\n**Do the bars that you sell include assay certificates?**\nMost bullion manufacturers do not issue assay certificates. Instead, all bars are stamped with the names of their makers, their weight and their purity — and some also bear a serial number. These markings attest to fineness and genuineness and are widely recognized by bullion dealers the world over, so a bar's value doesn't depend on having a certificate.\nMost of our bars come from suppliers on industry-standard Good Delivery lists:\n- Gold and Silver: LBMA - Gold & Silver\n- Platinum: LPPM - Platinum\n- Palladium: LPPM - Palladium","All","All","Do the bars that you sell include assay certificates?"],		
["Bullion Products","What You Can Buy","3","What denominations are in your 90% silver bags?","**Short answer:** Each bag holds one denomination of U.S. 90% silver coins dated 1964 and earlier — dimes, quarters, half dollars or dollars.\n\n**What denominations are in your 90% silver bags?**\nOur 90% junk silver bags contain silver coins that circulated in the United States, dated 1964 and earlier: dimes, quarters, half dollars and dollars. Each bag contains the same denomination. We cannot guarantee a specific denomination, but if we can accommodate your request, we're more than happy to.","All","All","What denominations are in your 90% silver bags?"],		
["Bullion Products","Product Info & Terms","2","Why do my coins/bars appear spotted or dirty?","**Short answer:** Totally normal — and it doesn't affect value. Spots are usually harmless residue from manufacturing, and your coins and bars will still fetch their full market price.\n\n**Why do my coins/bars appear spotted or dirty?**\nYour coins or bars may have been previously owned — but even new ones can show red- or white-tinged marks, flecks or streaks. This is a relatively common occurrence and not at all problematic:\n- Most marks are residues of chemical and coatings used in the manufacturing process.\n- They can often be polished off with a soft cloth.\n- Even if they're hard to clean, they're superficial marks, not impurities.\nBullion value depends on metal content, not appearance. Minor blemishes and regular wear and tear don't reduce value, and your coins/bars will fetch their full market price whenever you resell them.","All","All","Why do my coins/bars appear spotted or dirty?"],		
["Bullion Products","Prices, Minimums & Deposits","1","What is spot price, and why is my price different?","**Short answer:** Spot price is the live market price for raw metal. The price you pay also covers the cost of refining it and making it into coins and bars.\n\n**What does Spot Price mean?**\nThe spot price is the current market price at which an asset is bought or sold for immediate payment and delivery. For gold, it's set by the commodity's most highly traded futures contract — which might be the current month or two or more months into the future. Today, the gold spot price is a fluctuating combination of world futures market prices (mostly influenced by the highly fractionally reserved COMEX and London Gold Market), found via buying and selling virtual contracts representing the potentially deliverable physical metal.\n\n**Why is there a difference between the spot price listed on your website and the price that I pay?**\nSpot price is what metal trades for on the open commodity market. It doesn't include the (usually high) costs of refining raw, newly-mined metal and manufacturing coins and bars. That fabrication cost is built into the prices on our bullion product list.","All","All","Why is there a difference between the spot price listed on your website and the price that I pay?\nWhat does Spot Price mean?"],		
["Bullion Products","Product Info & Terms","3","Bullion terms explained: troy ounce, face value, MintFirst","**Short answer:** A troy ounce (31.1 g) is how precious metals are weighed. Face value is the amount printed on a coin — not what it's worth. MintFirst means your coins come straight from the mint.\n\n**What is the difference between a troy ounce and a standard ounce?**\nA troy ounce is the standard measure for precious metals and gemstones — when we say \"ounce\" for gold, we always mean troy ounces.\n- 1 troy ounce = 31.1 grams = 1.09711 standard (avoirdupois) ounces\n- 1 standard ounce = 28.35 grams\nEverything in our online store is listed in troy ounces or grams.\n\n**What does Face Value refer to?**\nIt's the monetary value printed on a coin (or banknote, stamp or other financial instrument). For the coins Kitco buys and sells, it doesn't necessarily reflect actual worth. For example, a 1 oz Gold American Eagle has a face value of $50, but it's worth the spot value of its gold content — a much higher value.\n\n**What does MintFirst mean?**\nMintFirst coins come directly from the mint, not from a third-party seller — so you're the first to appreciate the luster and detail of your newly minted coins, in the same impeccable condition as when they left the Mint. MintFirst also lets you buy coins for a specific year, usually the current year of mintage.","All","All","What does MintFirst mean?\nWhat is the difference between a troy ounce and a standard ounce?\nWhat does Face Value refer to?"],		
["Bullion Products","Taxes & Reporting","1","Are purchases taxed or reported to the IRS or CRA?","**Short answer:** Sometimes — sales tax depends on what you buy and where it ships. We don't report your transactions to the IRS or CRA, but tax reporting is your responsibility.\n\n**Are the products that you sell taxable?**\n**U.S. shipments**\n- Kitco may charge sales tax depending on the items/quantity/purity of your purchase.\n- The rate is based on the State Kitco ships to, not necessarily the State you reside in.\n- Check our State Sales Tax page and select your shipping State for details.\n**Canadian shipments**\n- Kitco may charge sales tax depending on the purity of the metal.\n- All palladium and rhodium items (including Kitco Pool) and items not considered bullion (gifts, collectibles, etc.) are taxable.\n- Per the Canada Revenue Agency, bars, ingots, coins or wafers are tax-exempt if they meet these minimum purities:\n  - Gold: at least 99.5% pure metal\n  - Silver: at least 99.9% pure metal\n  - Platinum: at least 99.5% pure metal\n- The rate depends on the Province Kitco ships to, not necessarily your Province of residence.\n- All transactions at our Retail Store in Montreal, Quebec are charged the going Quebec tax rate, should taxes apply.\n\n**Do you report any transactions to the IRS or the Canada Revenue Agency?**\nNo, Kitco does not report customers' transactions to the IRS or the Canada Revenue Agency. It's your responsibility to research the tax implications of buying and selling precious metals and to file any documentation required in your tax jurisdiction.","All","All","Are the products that you sell taxable?\nDo you report any transactions to the IRS or the Canada Revenue Agency?"],		
["Bullion Products","Rhodium Sponge & Recognized Storage","1","What is Kitco Rhodium Sponge, and can I buy it?","**Short answer:** Kitco Rhodium Sponge is pure rhodium powder in sealed, serial-numbered bottles. We no longer sell it — but we'll still buy it back or convert it to rhodium Pool.\n\n**What is Kitco Rhodium Sponge?**\nIt's a Kitco-exclusive product: pure rhodium powder (.999+ fine). Magnified, pure rhodium looks porous and powdery — which is why the industry calls it \"sponge\". It's packaged in tough, tamper-proof pharmaceutical-grade plastic bottles, and each label shows a unique serial number, net weight and purity.\n\n**Can I buy Kitco Rhodium Sponge?**\nNot anymore — we only buy back Kitco Rhodium Sponge and no longer sell it. If you own some and want to sell it or convert it into rhodium Pool, call 1 877 775-4826 or 514 313-9999.","All","All","What is Kitco Rhodium Sponge?\nCan I buy Kitco Rhodium Sponge?"],		
["Bullion Products","Rhodium Sponge & Recognized Storage","2","What is the Kitco Chain of Integrity, and when is it broken?","**Short answer:** The Chain of Integrity means your rhodium sponge never leaves recognized suppliers, transporters and storage. Keeping it intact protects your resale price — taking delivery, using other storage or breaking the seal breaks the chain.\n\n**What is the Kitco Chain of Integrity?**\nIt's a process where rhodium sponge bought from Kitco never leaves the possession or control of recognized suppliers, transporters and facilities:\n- **Storing:** your sponge goes straight to a Kitco Recognized Storage Facility of your choice using a Kitco Recognized Secure Transport Provider.\n- **Selling back:** it ships directly from the storage facility back to us, again with a Kitco Recognized Secure Transport Provider.\nThis keeps your sponge assuredly pure and safe from unauthorized tampering that could substantially reduce its resale value (see \"What price will I receive when I sell my Kitco Rhodium Sponge?\").\nTo keep it in the chain, you can store it at our Kitco Recognized Storage Facility in the U.S. through Kitco Allocated Storage — fully segregated and allocated at a COMEX-approved facility.\nContact us: Tel 1 877-775-4826 (USA and Canada) / 1 514 313-9999 (Worldwide) · info@kitco.com · https://online.kitco.com/storage\n\n**When is the Kitco Chain of Integrity considered broken?**\nWhen:\n- You take possession of the physical product\n- You store it with a facility other than a Kitco Recognized Storage Facility\n- You tamper with the seal of the bottle(s) — even inadvertently while visiting a Kitco Recognized Storage Facility\nIf a bottle is tampered with in a Kitco Recognized Storage Facility, it must be assayed at a Kitco facility before a price can be confirmed. All shipping, insurance and assay charges are your responsibility.","All","All","What is the Kitco Chain of Integrity?\nWhen is the Kitco Chain of Integrity considered broken?"],		
["Bullion Products","Rhodium Sponge & Recognized Storage","3","Kitco Recognized Storage Facilities: benefits, costs and alternatives","**Short answer:** A Kitco Recognized Storage Facility keeps your Chain of Integrity intact, makes reselling simple and insures your metal. Storage fees apply. You can store elsewhere, but it'll lower your resale price.\n\n**What are the benefits of using a Kitco Recognized Storage Facility?**\n- Keeps the Kitco Chain of Integrity intact, so the resale value of your rhodium is not compromised\n- Simpler, less costly logistics when you liquidate all or part of your holding\n- No shipping and insurance fees for taking physical delivery\n- The storage provider insures your metal against loss or damage (see your storage agreement for terms and conditions)\n- Your sponge is stored segregated from other customers' assets\n\n**Are there costs involved with using a Kitco Recognized Storage Facility?**\nYes — storage fees covering insurance and handling costs apply. They vary depending on the facility you choose.\n\n**Can I use a storage provider other than a Kitco Recognized Storage Facility?**\nYes, but it will break the Kitco Chain of Integrity and negatively impact the price you can sell your rhodium for.","All","All","What are the benefits of using a Kitco Recognized Storage Facility?\nAre there costs involved with using a Kitco Recognized Storage Facility?\nCan I use a storage provider other than a Kitco Recognized Storage Facility?"],		
["Bullion Products","Rhodium Sponge & Recognized Storage","4","How do I sell rhodium sponge, and what price will I get?","**Short answer:** If the Chain of Integrity is intact, you get 100% of the Kitco Rhodium spot bid price with no assay. If it's broken, you get 95% (seal intact) or 80% minus a $300 assay fee per bottle (seal broken). Whole bottles only.\n\n**What price will I receive when I sell my Kitco Rhodium Sponge?**\n- **Chain of Integrity intact:** 100% of the Kitco Rhodium spot bid price, without requiring an assay test.\n- **Chain broken, seal intact:** 95%* of the Kitco Rhodium spot bid price.\n- **Chain broken, seal not intact:** 80%* of the Kitco Rhodium spot bid price, less an assay fee of $300 per bottle.\nHeads up: assaying is destructive, so assayed material can't be returned to you in its original condition.\n\n**How do I sell my Kitco Rhodium Sponge when the Kitco Chain of Integrity is intact?**\nYour sponge must already be at a Kitco Recognized Storage Facility — we only confirm a price once it's there.\n1. Call 1 877 775-4826 or 514 313-9999 to confirm your selling price.\n2. Within one business day, tell your Kitco Recognized Storage Facility to transfer your sponge to us. (It can take up to two business days for them to do it.)\n3. Your sponge must reach Kitco within 10 business days of your price being confirmed.\n4. We pay you as soon as the facility confirms the transfer, that your sponge never left the facility and that its seals are intact.\n\n**How do I sell my Kitco Rhodium Sponge when the Kitco Chain of Integrity is broken?**\nCall 1 877 775-4826 or 514 313-9999, 8:30 a.m. to 10:00 p.m. ET, Monday to Thursday, and 8:30 a.m. to 5:00 p.m. ET on Friday.\n\n**If I own a 10 oz bottle of Kitco Rhodium Sponge within the Kitco Chain of Integrity and I only want to sell back 5 oz, will I be able to?**\nNo — you can only sell an entire bottle at a time. We can't buy back part of a bottle.\n\n**Can I sell my rhodium sponge, bar or coin purchased from an external supplier?**\n- **Rhodium bars and coins:** yes, if they're from recognized mints and refiners. The price depends on factors like the source and purity of the metal and whether assaying is needed.\n- **Rhodium sponge:** no — Kitco does not purchase rhodium sponge bought from external suppliers.","All","All","How do I sell my Kitco Rhodium Sponge when the Kitco Chain of Integrity is intact?\nHow do I sell my Kitco Rhodium Sponge when the Kitco Chain of Integrity is broken?\nWhat price will I receive when I sell my Kitco Rhodium Sponge?\nIf I own a 10 oz bottle of Kitco Rhodium Sponge within the Kitco Chain of Integrity and I only want to sell back 5 oz, will I be able to?\nCan I sell my rhodium sponge, bar or coin purchased from an external supplier?"],		
["Bullion Products","Rhodium Sponge & Recognized Storage","5","Can I transfer between Rhodium Sponge and a Rhodium Pool account?","**Short answer:** Sponge → Pool: yes (ounce for ounce if the Chain of Integrity is intact). Pool → Sponge: no, since sponge is no longer sold.\n\n**Can I transfer my ounces of Kitco Rhodium Pool - Metal Account to Kitco Rhodium Sponge?**\nNo — Rhodium Pool holdings can't be converted into or transferred to Kitco Rhodium Sponge, because sponge is no longer available for purchase.\n\n**Can I transfer my ounces of Kitco Rhodium Sponge to a Kitco Rhodium Pool - Metal Account?**\nYes!\n- **Inside the Chain of Integrity:** we convert it ounce for ounce.\n- **Outside the Chain of Integrity:** the conversion is based on purity and whether the bottles have been tampered with.\nEither way, you will lose the fabrication fees.\nQuestions? Call 1 877 775-4826 or 514 313-9999, 8:30 a.m. to 10:00 p.m. ET, Monday to Friday.","All","All","Can I transfer my ounces of Kitco Rhodium Pool - Metal Account to Kitco Rhodium Sponge?\nCan I transfer my ounces of Kitco Rhodium Sponge to a Kitco Rhodium Pool - Metal Account?"],		
["Digital Metals","Kitco Pool","1","What is a Kitco Pool - Metal Account?","**Short answer:** A Kitco Pool - Metal Account lets you own a share of a pool of precious metals that we hold for you, instead of specific bars or coins.\n\n**What is a Kitco Pool - Metal Account?**\nPool is an unallocated account. You don't hold title to specific (allocated) bars or coins. Instead, you own a share of a pool of precious metals held by Kitco on your behalf.\n- The pool can be made up of precious metals in any form, including bars, coins and scrap metal.\n- Pool deposits are specifically identified and kept physically separate at all times from Kitco's own metal. They're not part of Kitco's assets.\n- They aren't split up by individual owner, but they belong entirely to Kitco customers who hold Pool.\n- Pool is stored by Kitco in secured depositories in various locations.\n- You can sell anytime, or exchange for physical metal (subject to the related fees and the time needed for fabrication and delivery).\n- Want physical metal? You can request any bullion product available in our online store once you pay the applicable fabrication, shipping and insurance charges.\n\n**Can I request that the holdings in my Kitco Pool - Metal Account are held as a specific product?**\nNo, Pool holdings can't be held as specific products. But you can convert them into any precious metal bullion product we normally carry, once you pay the applicable fabrication, shipping and insurance charges.","All","All","What is a Kitco Pool - Metal Account?\nCan I request that the holdings in my Kitco Pool - Metal Account are held as a specific product?"],		
["Digital Metals","Kitco Pool","2","Pool minimums and deposits","**Short answer:** There's no minimum for Pool. Depending on the size of your open transactions, you may need a credit card on file or a 15% or 25% deposit to lock in a price.\n\n**Is there a minimum amount of Pool that I must buy or sell?**\nNope, there's no minimum amount of Pool you can buy from or sell to Kitco.\n\n**When is a deposit of funds required to purchase Pool? Do I need to pay to confirm a price?**\nSometimes. It depends on where you live (or where your business is based) and the total value of your open transactions.\n\nU.S. and Canada\n- Up to $50,000: no deposit, but you'll need to submit a valid Visa or MasterCard credit card number.\n- Over $50,000 and up to $100,000: you may need a valid Visa or MasterCard, and you'll need 15% of the total value of all open transactions in cleared funds or cleared Kitco Pool.\n- Over $100,000: you may need a valid Visa or MasterCard, and you'll need 25% of the total value of all open transactions in cleared funds or cleared Kitco Pool.\n\nAll other countries\n- Up to $20,000: no deposit, but you'll need to submit a valid Visa or MasterCard credit card number.\n- Over $20,000 and up to $100,000: you may need a valid Visa or MasterCard, and you'll need 15% in cleared funds or cleared Kitco Pool.\n- Over $100,000: you may need a valid Visa or MasterCard, and you'll need 25% in cleared funds or cleared Kitco Pool.\n\nGood to know\n- Open transactions means all your outstanding or incomplete purchases and sales, plus your current purchase. Sales of Kitco Pool aren't included.\n- Values are counted in U.S. dollars. For other currencies, we use the U.S. dollar equivalent, rounded up to the nearest $1,000.\n- Your credit card is used to confirm your price and, at Kitco's discretion, to recoup any market loss charges and other fees.\n- Funds are cleared when there are no holds on them. A cleared Kitco Pool holding is fully paid for, with no claims outstanding.","All","All","Is there a minimum amount of Pool that I must buy or sell?\nWhen is a deposit of funds required to purchase Pool? Do I need to pay to confirm a price?"],		
["Digital Metals","Kitco Pool","3","What fees apply to Kitco Pool?","**Short answer:** Pool trades have an administrative fee of $14.99 online or $19.99 by phone or in person. Fabrication fees only apply if you convert Pool into physical bars or coins.\n\n**Why am I being charged an administrative fee to buy or sell from my Kitco Pool - Metal Account?**\nPool is the most cost-effective way to hold precious metals. To cover part of our admin costs, we charge an administrative fee on every purchase and sale that involves Pool (including Pool combined with physical metals):\n- $14.99 online\n- $19.99 by telephone or in person\n- Charged in USD for U.S. dollar trades and in CAD for Canadian dollar trades\n- For Euro or British pound trades, charged in the EUR or GBP equivalent of the U.S. dollar amount\n\n**What are fabrication fees?**\nFabrication fees cover the cost of manufacturing precious metal coins and bars. You don't pay them when you buy Pool, because Pool is bought as unallocated units. They only apply (along with shipping and insurance) when you convert Pool holdings into bullion products.","All","All","Why am I being charged an administrative fee to buy or sell from my Kitco Pool - Metal Account?\nWhat are fabrication fees?"],		
["Digital Metals","Kitco Pool","4","Are my Kitco Pool - Metal Account holdings insured?","**Short answer:** Yes. Pool metals are kept in secured depositories, and each one insures them.\n\n**Are my Kitco Pool - Metal Account holdings insured?**\nYes. Pool metals are stored by Kitco in secured depositories in various locations. Each depository insures them under its own specific policies against loss, damage and destruction.","All","All","Are my Kitco Pool - Metal Account holdings insured?"],		
["Digital Metals","Kitco Pool","5","How do I convert my Kitco Pool holdings to physical metal?","**Short answer:** Just give us a call. You'll pay fabrication, shipping and insurance costs, which depend on the products you pick.\n\n**How can I exchange my holdings from a Kitco Pool - Metal Account to precious metal bullion products?**\nCall 1 877 775-4826 to exchange your Pool ounces for bullion products. You'll be charged fabrication, shipping and insurance costs.","All","All","How can I exchange my holdings from a Kitco Pool - Metal Account to precious metal bullion products?"],		
["Digital Metals","Kitco Pool","6","When could my Kitco Pool - Metal Account holdings or the proceeds from my Kitco Pool - Metal Account sale be withheld?","**Short answer:** If your Pool is being used as collateral, it's held until your purchase is paid for or the metal you're selling arrives.\n\n**When could my Kitco Pool - Metal Account holdings or the proceeds from my Kitco Pool - Metal Account sale be withheld?**\n- If part of your Pool is being used as collateral for a purchase or sale, it's withheld until Kitco receives full payment for what you buy, or physically receives the metal you've agreed to sell.\n- If you cancel and owe Kitco for market loss, we may set off what you owe against the cleared funds on your Kitco account.\n\nSelling Pool that's being used as collateral? You've got two options:\n1. Receive the entire proceeds of the sale, as long as you keep the required collateral amount as funds on your account, or\n2. Have the collateral amount deducted from the proceeds and moved to the funds on your account, and receive the rest.\nEither way, the hold ends as soon as Kitco is paid in full for the purchase or receives the metal for the sale.\n\nExample\nYou make a $200,000 purchase or sale and use $50,000 in cleared Pool to confirm your price. You can sell that Pool before Kitco receives payment or shipment for the $200,000 transaction, as long as you keep at least $50,000 in cleared funds or cleared Kitco Pool in your account until then. One easy way: sell your Pool and leave the funds in your Kitco account.","All","All","When could my Kitco Pool - Metal Account holdings or the proceeds from my Kitco Pool - Metal Account sale be withheld?"],		
["Digital Metals","VaultChain™","1","What is VaultChain™, and what is the Tradewind platform?","**Short answer:** VaultChain™ lets you buy, hold and trade fine gold and silver digitally. It's stored at the Royal Canadian Mint and tracked on the Tradewind blockchain.\n\n**What is VaultChain™ and how does it work?**\n- Buy, hold and trade fine gold and silver digitally, in a secure, modern and convenient way.\n- Your holdings are stored at the trusted Royal Canadian Mint.\n- Blockchain technology tracks and verifies your holdings in real time, with tamper-proof records and cryptographic signatures.\n- The Royal Canadian Mint authenticates the physical gold and silver, while Tradewind and its partners manage your holdings on the blockchain.\n\n**What is the Tradewind platform?**\nTradewind is an electronic market and blockchain technology solution that connects market participants and lets them deal in VaultChain™ Gold and VaultChain™ Silver.","All","All","What is VaultChain™ and how does it work?\nWhat is the Tradewind platform?"],		
["Digital Metals","VaultChain™","2","How do I buy, sell and get paid for VaultChain™?","**Short answer:** Trade 24/7 online, lock in your price with a credit card, and your ounces land in your account within 3 business days of payment. When you sell, get paid by check, wire, bullion or account credit.\n\n**How do I trade VaultChain™ ?**\n1. Open your account. Our online store is open 24/7.\n2. Lock in your price with your credit card (terms apply, see our collateral requirements).\n3. Choose how you'd like to pay.\n4. Once we receive your payment, your VaultChain™ ounces are added to your account within 3 business days using blockchain technology.\nTrack your holdings anytime, anywhere, with full transparency through the distributed ledger.\n\nMinimums\n- VaultChain™ Gold: start with as little as 0.001 oz\n- VaultChain™ Silver: start with as little as 0.01 oz\n- Your first VaultChain™ Silver transaction needs a minimum purchase of 100 oz. After that, trade gold or silver in any amount.\n\n**How can I pay for VaultChain™ Gold or Silver?**\nWe offer a variety of methods of payment for VaultChain™ Gold and Silver. Check our methods of payment page for the full list.\n\n**How can I receive payment for selling VaultChain™ Gold or Silver?**\nYour options depend on where you live (or where your business is based).\n\nFree\n- Check by regular mail (U.S. & Canada only)\n- Bullion products normally carried by Kitco\n- Credit to the funds on your account\n- Credit to your Kitco Pool account\n\nWith a fee\n- Check by courier: $30 (U.S. & Canada only)\n- USD or CAD bank wire to a bank in the USA or Canada: $40\n- USD or CAD bank wire to a bank outside the USA and Canada: $60 (Kitco covers all intermediary bank fees)\n- GBP or EUR bank wire: £50/€60\n\nGood to know\n- Checks are only for USD or CAD payments to residents of the U.S. and Canada.\n- Wires between the U.S. and Canada are charged international wire fees, because the funds are leaving the country.\n- Wires to Canada must include the beneficiary's full address (no P.O. Boxes). Missing or incomplete info may cause delays or rejection by the banks.\n- GBP or EUR payments can only be made by bank wire or credited to your account funds.","All","All","How do I trade VaultChain™ ?\nHow can I pay for VaultChain™ Gold or Silver?\nHow can I receive payment for selling VaultChain™ Gold or Silver?"],		
["Digital Metals","VaultChain™","3","VaultChain™ fees and invoices","**Short answer:** VaultChain™ has a $100 annual fee. If the daily value-based storage fee (0.12% for gold, 0.3% for silver) adds up to more, you pay the difference, invoiced once a year.\n\n**Are there any fees involved?**\nHere's how it works:\n- Annual fee: $100, charged at the start of each year.\n- Market-based storage fee: each day, we calculate a storage fee based on the market value of your holdings, using the London Gold PM Fix for gold and the London Silver Fix for silver.\n- Rate: 0.12% a year for gold and 0.3% a year for silver.\n- Daily breakdown: the annual storage fee is divided by 365, so the daily charge moves with the market.\n- If the percentage-based fee is less than your annual fee, you're all set. If it's higher, you just pay the difference.\n\nNew account? Your first annual fee is prorated based on when you make your first transaction:\n- January–March: $100\n- April–June: $75\n- July–September: $50\n- October–December: $25\nFees are subject to Quebec GST & PST where applicable.\n\n**How will I receive my invoice for VaultChain™?**\nYou'll see quarterly fee projections in your online profile, so you know what's coming. Any storage fees beyond the $100 annual fee are invoiced and collected annually, starting at the end of each year.","All","All","Are there any fees involved?\nHow will I receive my invoice for VaultChain™?"],		
["Digital Metals","VaultChain™","4","What is Kitco VaultChain™ Institutional?","**Short answer:** It's VaultChain™ for financial institutions, so their customers can trade gold and silver on the blockchain.\n\n**What is Kitco VaultChain™ Institutional?**\nVaultChain™ Institutional is Kitco's offering for a wide range of financial institutions. Your customers can easily trade gold and silver using blockchain technology, with:\n- low transaction costs\n- fast settlement times\n- the ability to convert to physical bullion at any time\nLearn more at Kitco Digital Metals.","All","All","What is Kitco VaultChain™ Institutional?"],		
["Digital Metals","VaultChain™","5","How is my VaultChain™ Gold and Silver kept secure?","**Short answer:** Your metal is guaranteed by the Royal Canadian Mint, and the Tradewind blockchain is the official record that you own it.\n\n**How is my VaultChain Gold and Silver kept secure?**\nYour VaultChain Wallet protects your gold and silver in three ways:\n1. The Royal Canadian Mint, a Crown Corporation of Canada, guarantees the gold and silver against loss or destruction.\n2. The Royal Canadian Mint recognizes the Tradewind blockchain as the definitive record of ownership.\n3. Your VaultChain Wallet shows the true current ownership records for your account, so you can verify you own these assets securely and privately.","All","All","How is my VaultChain Gold and Silver kept secure?"],		
["Digital Metals","VaultChain™","6","How do I get physical gold and silver from VaultChain™?","**Short answer:** Call our customer experience team anytime. Fabrication and delivery fees depend on the products you pick.\n\n**How can I get physical gold & silver from my VaultChain™ account?**\nCall our customer experience team anytime to make a request. Browse Kitco's online store to see the products you can choose from. Fabrication and delivery fees vary depending on the products you select.","All","All","How can I get physical gold & silver from my VaultChain™ account?"],		
["Kitco Services","Kitco Allocated Storage","1","What is Kitco Allocated Storage, and why use it?","**Short answer:** Kitco Allocated Storage lets you buy bullion from us and store it in your own name, with title to specific coins and bars, in high-security vaults in Canada or Hong Kong.\n\n**What is the Kitco Allocated Storage program?**\nYou buy precious metal bullion products from Kitco and we store them on a segregated and allocated basis. That means you have title to specific coins and bars, kept in highly secure depositories in Canada (including a Crown Corporation) or in Hong Kong. You can withdraw, add to, or sell your holdings at any time.\n\n**What are the advantages of the Kitco Allocated Storage program?**\n- Your metals are segregated and fully allocated. They're stored in your name and remain your property at all times.\n- Track your holdings online through your Kitco account, any time of day or night.\n- Your metals are fully insured against loss, damage and theft.\n- You get an annual audit report from an independent third party, at no extra cost.\n- Top-tier storage from internationally recognized providers, using the latest security technology.\n- Affordable, competitive storage rates.\n- First-class service and security at some of the most secure facilities in the world.\n- Preferential rates when you buy and store your metals with Kitco.","All","All","What is the Kitco Allocated Storage program?\nWhat are the advantages of the Kitco Allocated Storage program?"],		
["Kitco Services","Kitco Allocated Storage","2","How do I enroll, and what can I store?","**Short answer:** Give us a call (or fill out the online quote form) and we'll send you an enrollment package. You can store any bullion we sell, in minimum lots of 10 oz gold or platinum, or 500 oz silver.\n\n**How do I enroll in the Kitco Allocated Storage program?**\n1. Call 1 877 775-4826 (U.S. & Canada) or 514 313-9999 (worldwide) to talk to one of our trained precious metals agents. We're here Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET.\n2. We'll send you an enrollment package with your Kitco Allocated Storage Agreement and a personalized proposal.\nNo time to call today? Just complete our online quote form and our team will get back to you within 1 business day.\n\n**What kinds of precious metal products can I hold in my Kitco Allocated Storage?**\nAll bullion products sold by Kitco can be stored, in these minimum increments:\n- Gold: 10 oz\n- Silver: 500 oz\n- Platinum: 10 oz\nWant to store something that isn't listed? It may be possible, so please contact us.","All","All","How do I enroll in the Kitco Allocated Storage program?\nWhat kinds of precious metal products can I hold in my Kitco Allocated Storage?"],		
["Kitco Services","Kitco Allocated Storage","3","Where are my metals stored, can I visit, and are they insured?","**Short answer:** Your metals are kept at the secure facility you choose, in Canada or Hong Kong. Visits aren't allowed, but everything is fully insured, and insurance is included in your storage fees.\n\n**Where are the precious metals in my Kitco Allocated Storage stored?**\nAt the secure storage facility of your choice. Kitco offers storage in Canada and Hong Kong.\n\n**Can I visit the storage facility to view my holdings?**\nNo. For security reasons, only people with the appropriate high-level security clearance can enter the storage facilities.\n\n**Are my Kitco Allocated Storage holdings insured?**\nYes. All metals in Kitco Allocated Storage are fully insured, and the full cost of insurance is included in your storage fees. You'll find more detail on your coverage, including limited exclusions, in your Kitco Allocated Storage Agreement.","All","All","Where are the precious metals in my Kitco Allocated Storage stored?\nCan I visit the storage facility to view my holdings?\nAre my Kitco Allocated Storage holdings insured?"],		
["Kitco Services","Storage Fees & Invoicing","1","Storage costs, invoices and how to pay","**Short answer:** Storage fees are personalized and billed monthly. There's a $35 fee to sell and a $75 fee to withdraw, and invoices are due within 30 days.\n\n**What are the costs associated with the Kitco Allocated Storage program?**\n- Storage fees: based on the quantity and type of metals you store, personalized for your holdings and billed monthly.\n- Precious metals transfer fee: $35 (plus applicable taxes) for each sale from your storage.\n- Administrative withdrawal fee: $75 (plus applicable taxes) when you withdraw metals. Shipping, handling and insurance charges may also apply.\nFor a personalized quote, call 1 877 775-4826 (U.S. & Canada) or 514 313-9999 (worldwide). We're here Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET.\n\n**How will I be invoiced my monthly fees?**\nYou'll get a detailed monthly invoice by email or postal service, whichever you prefer. Payment is due within thirty (30) days.\n\n**How do I pay my storage invoice?**\nYou can pay by:\n- Credit card\n- Check\n- Cleared funds held on your Kitco account\n- Bank wire","All","All","What are the costs associated with the Kitco Allocated Storage program?\nHow will I be invoiced my monthly fees?\nHow do I pay my storage invoice?"],		
["Kitco Services","Kitco Allocated Storage","4","How do I add, sell or withdraw stored metals?","**Short answer:** To add or sell metals, just call us. To withdraw, send us a Notice of Withdrawal Form. And when you sell metals from storage, you get a higher bid than our store price.\n\n**How do I add precious metals to my Kitco Allocated Storage?**\nCall 1 877 775-4826 (U.S. & Canada) or 514 313-9999 (worldwide). Our agents will help you buy eligible products and have them transferred into your storage. You can sometimes transfer and store metals you already have, so give us a call and we'll check if yours are eligible. We're here Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET.\n\n**How do I sell precious metals from my Kitco Allocated Storage?**\nTo sell any or all of your stored metals, call 1 877 775-4826 (U.S. & Canada) or 514 313-9999 (worldwide). We're here Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET.\n\n**How do I withdraw my precious metals from my Kitco Allocated Storage account?**\nA withdrawal means physically moving metals out of storage and into your possession. Heads-up: once withdrawn, products can't be re-deposited into your Kitco Allocated Storage.\n1. Complete the Notice of Withdrawal Form.\n2. Send it to us by email, mail or fax:\n- Email: info@kitco.com\n- Mail: Kitco Metals Inc., 620 Cathcart, Suite 900, Montreal, Quebec H3B 1M1\n- Fax: 1 514 875-6484\n3. For your security, we'll confirm every withdrawal request by phone.\n\n**Why can we offer a higher bid when buying back from customers whose holdings are under Kitco Allocated Storage?**\nWhen we buy metal that's shipped to us, there's a delay until it arrives, plus a verification process that takes time and costs money. That cost is built into the bid premium we quote. If your products are kept under Kitco's Chain of Integrity (sold or verified by Kitco in advance), we skip that step and pass the liquidation savings on to you. Your bid premium still reflects market conditions, but it will always be higher than the one posted on our store. Yet another reason to consider allocated storage!","All","All","How do I add precious metals to my Kitco Allocated Storage?\nHow do I sell precious metals from my Kitco Allocated Storage?\nHow do I withdraw my precious metals from my Kitco Allocated Storage account?\nWhy can we offer a higher bid when buying back from customers whose holdings are under Kitco Allocated Storage?"],		
["Kitco Services","Kitco Allocated Storage","5","How can I view and audit my holdings?","**Short answer:** Yes. You can see your holdings online anytime, and they're audited three times a year by Kitco plus once a year by an independent auditor, with a free report.\n\n**Can I view my current Kitco Allocated Storage holdings?**\nYes. Sign in to your Kitco account and select the Kitco storage tab. Your monthly storage invoice also lists your holdings.\n\n**Are my Kitco Allocated Storage holdings audited?**\nYes:\n- Kitco audits your holdings internally three times a year.\n- An independent third-party auditor audits them once a year, at the beginning of each year.\n- You'll get a free written report of the independent audit, confirming the type and quantity of metals in your holdings.\n\n**Can I request more than one independent audit report per year?**\nYes. You can request additional third-party audits at your cost. One annual independent audit is included in your storage fee.","All","All","Can I view my current Kitco Allocated Storage holdings?\nAre my Kitco Allocated Storage holdings audited?\nCan I request more than one independent audit report per year?"],		
["Kitco Services","Precious Metals IRA","1","What is a Precious Metals IRA, and how do I get started?","**Short answer:** A Precious Metals IRA lets you hold physical gold, silver, platinum and palladium for retirement. Open an account with Kitco and one of our partner custodians, fund it, then call us to order.\n\n**What is a Precious Metal IRA?**\nIt lets you diversify your retirement holdings with precious metals. The U.S. government allows physical gold, silver, platinum and palladium to be held in an IRA. All bullion you buy through Kitco for your IRA is held with one of our partner custodians.\n\n**How do I get started?**\n1. Open an account with Kitco and with one of our partnered custodians, whichever you choose.\n2. Pick your IRA type with your custodian, such as a Roth or traditional IRA. Your custodian can explain the options, which one may suit you best, and how to transfer or roll over funds.\n3. Once your account is funded through your custodian, give us a call and let us know you'd like to place an IRA order.","All","All","What is a Precious Metal IRA?\nHow do I get started?"],		
["Kitco Services","Precious Metals IRA","2","IRA custodians and naming Kitco as your representative","**Short answer:** You can use any of our 10 partner custodians. Some also let you name Kitco as your account representative, so we handle the paperwork for you.\n\n**Which partner IRA Custodian can I hold my metals with?**\nWe've built relationships with some of the most highly reputed, market-leading IRA custodians, so you get streamlined procedures and quick service. Our partner custodians are:\n- Equity Institutional\n- GoldStar Trust Company\n- New Direction IRA, Inc.\n- Provident Trust Group\n- NuView IRA, Inc\n- Sunwest Trust\n- American Estate & Trust\n- Self Directed IRA Services\n- The Kingdom Trust Company\n- Next Generation Trust Services\nKitco Metals Inc. does not endorse or assume responsibility for the content of external or third-party websites.\n\n**How can I designate Kitco as my account representative?**\nSome custodians let you name Kitco as your account representative. That eliminates the paperwork and follow-ups needed to complete your IRA transactions. Once you place an IRA purchase or sale, Kitco communicates with your custodian on your behalf so it's finalized smoothly and on time. Ask your custodian if they offer this, and they'll help you get started.","All","All","Which partner IRA Custodian can I hold my metals with?\nHow can I designate Kitco as my account representative?"],		
["Kitco Services","Precious Metals IRA","3","Which precious metals can I hold in my IRA?","**Short answer:** Products from recognized national mints, plus bars of a specified purity from ISO 9001:2008-certified or industry-listed refiners. Popular Eagles, Maples, Buffalos and refiner bars all qualify.\n\n**Which precious metals can I hold in my IRA?**\nTo qualify for your IRA or 401K, a product must be made by a recognized national mint. Products of a specified purity are also allowed if they're made by refiners with ISO 9001:2008 certification or named on an industry-standard list. Kitco offers a very wide range of products that meet these rules.\nHere's a simplified list of common items all our partner custodians accept (ask your custodian for a wider list):\n\nGold\n- 1 oz Gold American Eagle coins\n- 1 oz Gold American Buffalo coins\n- 1 oz Gold Canadian Maple Leaf coins\n- Gold bars from various recognized refiners\n\nSilver\n- 1 oz Silver American Eagle coins\n- 1 oz Silver Canadian Maple Leaf coins\n- 10 oz Silver Royal Canadian Mint Bar\n- 100 oz Silver Royal Canadian Mint Bar\n- Silver bars from various recognized refiners, including Sunshine Mint bars\n\nPlatinum\n- 1 oz Platinum Canadian Maple Leaf coins\n- Platinum bars from various recognized refiners\n\nPalladium\n- 1 oz Palladium Canadian Maple Leaf coins\n- Palladium bars from various recognized refiners","All","All","Which precious metals can I hold in my IRA?"],		
["Scrap","Selling Scrap","1","What scrap do you buy, and who can sell it?","**Short answer:** Scrap is any gold, silver, platinum or palladium that isn't a standard bullion product. Only businesses in a related trade can sell it to us.\n**What is scrap metal?**\nScrap is gold, silver, platinum and palladium in any form we don't usually sell in our online store. That includes:\n- Jewelry and watches\n- Metal filings\n- Silver tableware and decorative items\n- Dental gold\n- Bars stamped by anyone other than a refiner on an industry-standard Good Delivery List\nSelling coins, bars or Kitco Rhodium Sponge instead? See our Selling precious metal bullion products FAQs.\n**Who can sell scrap metal?**\nOnly businesses whose work has a logical link to scrap metal, such as jewelers, pawn shops, antique dealers, manufacturers and dental laboratories.\nPrivate individuals can't sell scrap to Kitco. If an individual sends us scrap, we'll return it at their own cost.\n**What types of scrap metal does Kitco buy?**\nA wide range, from businesses whose primary activity pertains to precious metals. See the list of what we buy on our website.\nHave something containing precious metal that's not on the list? Call us at 1 877 775-4826 or 514 313-9999 (Monday to Thursday, 8:30 a.m. to 10:00 p.m. ET, and Friday, 8:30 a.m. to 5:00 p.m. ET).","All","All","What is scrap metal?\nWho can sell scrap metal?\nWhat types of scrap metal does Kitco buy?"],
